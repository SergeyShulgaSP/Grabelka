<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
</head>
<body>
<title>Грабелька MVP</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:wght@600;700&family=PT+Sans:wght@400;700&family=PT+Sans+Narrow:wght@700&display=swap">
<style>
/* Layout: one phone-width app column on a cream ground; sticky header, scrolling screen, fixed bottom tab bar. */
:root{
  --bg:#f3eee2;        /* page ground */
  --paper:#fbf8f0;     /* app column */
  --card:#ffffff;
  --ink:#2b2a20;
  --ink-2:#6d6a58;
  --line:#e4dccb;
  --green:#3d6b2f;     /* trust: "Проверен", "Сегодня собрано", active tab */
  --green-soft:#e3ebd6;
  --mustard:#ecb53f;   /* actions */
  --mustard-d:#c99520;
  --red:#b5442f;       /* badges, cancel */
  --red-soft:#f6e1da;
  --on-green:#ffffff;
  --art-bg:#efe8d6;
  --f-display:"Lora",Georgia,"Times New Roman",serif;
  --f-body:"PT Sans","Segoe UI",Arial,sans-serif;
  --f-label:"PT Sans Narrow","Arial Narrow",Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#171812;--paper:#1f211a;--card:#282b22;--ink:#efeadc;--ink-2:#b2ad98;--line:#3a3d31;
  --green:#8fbb73;--green-soft:#2e3a25;--mustard:#e8b446;--mustard-d:#b98d22;--red:#e07a62;--red-soft:#3d2620;
  --on-green:#14170f;--art-bg:#35372c;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#171812;--paper:#1f211a;--card:#282b22;--ink:#efeadc;--ink-2:#b2ad98;--line:#3a3d31;
  --green:#8fbb73;--green-soft:#2e3a25;--mustard:#e8b446;--mustard-d:#b98d22;--red:#e07a62;--red-soft:#3d2620;
  --on-green:#14170f;--art-bg:#35372c;color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--paper)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--green);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.app{max-width:480px;margin:0 auto;min-height:100vh;background:var(--paper);position:relative;box-shadow:0 0 0 1px var(--line);padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-display);font-weight:700;margin:0;line-height:1.15;text-wrap:balance}
h2{font-size:21px}h3{font-size:16px}
p{margin:0}
.muted{color:var(--ink-2)}
.small{font-size:13px}
.num{font-variant-numeric:tabular-nums}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--paper);display:grid;gap:10px;padding-block:10px 12px;border-bottom:1px solid var(--line)}
.top-row{display:flex;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:8px;background:none;border:0;padding:0;text-align:left}
.brand svg{width:34px;height:34px;flex:none}
.brand b{font-family:var(--f-display);font-size:22px;line-height:1;display:block}
.brand small{display:block;font-family:var(--f-label);text-transform:uppercase;font-size:9.5px;letter-spacing:.08em;color:var(--ink-2);margin-top:2px}
.city{margin-left:auto;display:flex;align-items:center;gap:4px;font-size:13px;color:var(--ink-2)}
.city svg{width:15px;height:15px;color:var(--green)}
.iconbtn{position:relative;background:none;border:0;padding:6px;display:grid;place-items:center;border-radius:8px}
.iconbtn svg{width:24px;height:24px}
.dot{position:absolute;top:0;right:-2px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--mustard);color:#2b2a20;font-size:11px;font-weight:700;display:grid;place-items:center}
.search{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:0 12px}
.search svg{width:18px;height:18px;color:var(--ink-2);flex:none}
.search input{border:0;background:transparent;padding:10px 0;width:100%;outline:none}
.title-row{display:flex;align-items:center;gap:8px}
.title-row h1{font-size:22px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:12px 18px;background:var(--mustard);color:#2b2a20;font-weight:700;box-shadow:inset 0 -2px 0 var(--mustard-d)}
.btn:active{transform:translateY(1px)}
.btn svg{width:18px;height:18px}
.btn.wide{width:100%}
.btn.green{background:var(--green);color:var(--on-green);box-shadow:none}
.btn.ghost{background:transparent;box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.danger{background:transparent;color:var(--red);box-shadow:inset 0 0 0 1.5px var(--red)}
.btn.sm{padding:8px 12px;font-size:13px;border-radius:10px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.link{background:none;border:0;padding:0;color:var(--green);font-weight:700;font-size:13px;display:inline-flex;align-items:center;gap:4px}
.link svg{width:14px;height:14px}

/* sections */
.sec{display:grid;gap:12px;padding-block:18px}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px}

/* hero */
.hero{position:relative;overflow:hidden;min-height:228px;display:grid;align-content:center;padding-block:22px}
.hero .scene{position:absolute;inset:0;width:100%;height:100%}
.hero .txt{position:relative;max-width:62%;display:grid;gap:8px}
.hero h1{font-size:30px;line-height:1.02;color:#2b2a20}
.hero h1 span{display:block;font-size:20px}
.hero p{font-size:13px;color:#4c4a3c}

/* categories */
.cats{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
.cat{background:none;border:0;padding:0;display:grid;justify-items:center;gap:4px;font-size:12px}
.cat .ci{width:50px;height:50px;border-radius:50%;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;color:var(--ink)}
.cat .ci svg{width:30px;height:30px}

/* farmers row */
.hscroll{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding-inline:16px;padding-bottom:4px}
.hscroll::-webkit-scrollbar{display:none}
.farm-card{flex:0 0 150px;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;text-align:left;padding:0;display:grid}
.farm-card .cover{height:76px;display:grid;place-items:center;background:var(--green-soft)}
.farm-card .body{padding:10px;display:grid;gap:3px}
.farm-card b{font-size:14px;line-height:1.2}
.ava{width:46px;height:46px;border-radius:50%;background:var(--green);color:var(--on-green);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:18px;flex:none}
.ava.lg{width:64px;height:64px;font-size:24px}
.km{display:flex;align-items:center;gap:3px;font-size:12px;color:var(--ink-2)}
.km svg{width:12px;height:12px;color:var(--green)}

/* chips */
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding-inline:16px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:7px 14px;font-size:13px}
.chip.on{background:var(--green);border-color:var(--green);color:var(--on-green);font-weight:700}
select.sel{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 10px;font-size:13px}

/* product grid */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pc{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:grid;grid-template-rows:auto 1fr;position:relative}
.pc .ph{position:relative;aspect-ratio:4/3;background:var(--art-bg);border:0;padding:0;display:block;width:100%;max-width:100%}
.ph img,.ph svg.art{width:100%;height:100%;object-fit:cover;display:block}
.badge{display:inline-flex;align-items:center;gap:4px;border-radius:8px;padding:3px 7px;font-size:11px;font-weight:700;background:var(--green);color:var(--on-green)}
.badge svg{width:12px;height:12px}
.badge.soft{background:var(--green-soft);color:var(--green)}
.badge.ex{background:var(--red-soft);color:var(--red)}
.badge.mus{background:var(--mustard);color:#2b2a20}
.pc .tl{position:absolute;top:8px;left:8px;pointer-events:none;display:grid;gap:4px;justify-items:start}
.fav{position:absolute;top:6px;right:6px;width:32px;height:32px;border-radius:50%;border:0;background:rgba(255,255,255,.85);display:grid;place-items:center;color:#2b2a20}
.fav svg{width:18px;height:18px}
.fav.on{color:#b5442f}
.fav.on svg{fill:currentColor}
.pc .info{padding:10px;display:grid;gap:3px;align-content:start}
.pc .nm{font-weight:700;font-size:14px;line-height:1.2;background:none;border:0;padding:0;text-align:left}
.pc .meta{font-size:12px;color:var(--ink-2)}
.pc .row{display:flex;align-items:center;justify-content:space-between;margin-top:6px}
.price{font-family:var(--f-display);font-weight:700;font-size:19px;font-variant-numeric:tabular-nums}
.plus{width:36px;height:36px;border-radius:50%;border:0;background:var(--mustard);color:#2b2a20;display:grid;place-items:center;box-shadow:inset 0 -2px 0 var(--mustard-d)}
.plus svg{width:18px;height:18px}

/* product page */
.pp-photo{position:relative;aspect-ratio:4/3;max-width:100%;background:var(--art-bg)}
.pp-photo img,.pp-photo svg.art{width:100%;height:100%;object-fit:cover;display:block}
.pp-photo .back{position:absolute;top:10px;left:max(10px,env(safe-area-inset-left,0px));width:38px;height:38px;border-radius:50%;border:0;background:rgba(255,255,255,.88);color:#2b2a20;display:grid;place-items:center}
.pp-photo .back svg{width:20px;height:20px}
.pp-photo .fav{top:10px;right:max(10px,env(safe-area-inset-right,0px));width:38px;height:38px}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:12px;background:var(--card)}
.qty button{border:0;background:none;width:38px;height:40px;display:grid;place-items:center}
.qty button svg{width:16px;height:16px}
.qty span{min-width:26px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.qty.sm button{width:30px;height:32px}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fact{display:flex;gap:8px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;font-size:13px;line-height:1.25}
.fact svg{width:20px;height:20px;color:var(--green);flex:none}
.fact b{display:block}
.dl{display:grid;gap:12px}
.dl .it{display:flex;gap:10px}
.dl .it svg{width:20px;height:20px;color:var(--ink-2);flex:none;margin-top:1px}
.dl b{display:block;font-size:14px}
.dl p{font-size:13px;color:var(--ink-2)}
.farmer-box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:10px}
.farmer-box .hd{display:flex;gap:12px;align-items:center}
.quote{font-family:var(--f-display);font-style:italic;font-weight:600;font-size:14px;color:var(--ink-2);line-height:1.45}
.guar{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;font-size:12px}
.guar div{display:flex;gap:5px;align-items:center;line-height:1.2}
.guar svg{width:18px;height:18px;color:var(--green);flex:none}
.buybar{display:flex;gap:10px;align-items:center}
.buybar .btn{flex:1}

/* cart */
.steps{display:grid;grid-template-columns:repeat(4,1fr);position:relative;text-align:center;font-size:11px;color:var(--ink-2)}
.steps::before{content:"";position:absolute;top:15px;left:12%;right:12%;height:2px;background:var(--line)}
.steps div{position:relative;display:grid;justify-items:center;gap:4px}
.steps i{width:30px;height:30px;border-radius:50%;background:var(--card);border:2px solid var(--line);display:grid;place-items:center;font-style:normal;font-weight:700;font-size:12px}
.steps .on i{background:var(--green);border-color:var(--green);color:var(--on-green)}
.steps .on{color:var(--green);font-weight:700}
.farm-group{display:grid;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.farm-group .gh{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13px}
.ci-row{display:grid;grid-template-columns:56px 1fr auto;gap:10px;align-items:center}
.ci-row .th{width:56px;height:48px;border-radius:8px;overflow:hidden;background:var(--art-bg)}
.ci-row .th img,.ci-row .th svg{width:100%;height:100%;object-fit:cover;display:block}
.ci-row .nm{font-weight:700;font-size:13.5px;line-height:1.2;min-width:0}
.ci-row .rt{display:grid;justify-items:end;gap:4px}
.trash{border:0;background:none;color:var(--ink-2);padding:2px}
.trash svg{width:16px;height:16px}
.days{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.day{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 4px;text-align:center;font-size:12px;line-height:1.2}
.day b{display:block;font-size:13px}
.day.on{border:2px solid var(--green);background:var(--green-soft)}
.total{display:flex;justify-content:space-between;align-items:baseline}
.total .price{font-size:24px}
.toggle{display:flex;gap:10px;align-items:flex-start;background:var(--green-soft);border-radius:12px;padding:12px;font-size:13px}
.toggle input{width:20px;height:20px;accent-color:var(--green);flex:none;margin:1px 0 0}
.note{font-size:12.5px;color:var(--ink-2);background:var(--card);border:1px dashed var(--line);border-radius:10px;padding:10px}
.alert{display:flex;gap:10px;align-items:flex-start;border:1.5px solid var(--red);background:var(--red-soft);color:var(--red);border-radius:12px;padding:10px 12px;font-size:13px}
.alert svg{width:22px;height:22px;flex:none}
.farm-group.off{opacity:.55}
.pick{display:flex;gap:8px;align-items:center;cursor:pointer}
.pick input{width:18px;height:18px;accent-color:var(--green);margin:0}
.warn{font-size:13px;color:var(--red);background:var(--red-soft);border-radius:10px;padding:10px}

/* forms */
.form{display:grid;gap:12px}
.fld{display:grid;gap:4px}
.fld label{font-size:13px;font-weight:700}
.fld .hint{font-size:12px;color:var(--ink-2)}
.fld input,.fld select,.fld textarea{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 12px;width:100%;min-width:0}
.fld textarea{min-height:84px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.photo-pick{display:grid;place-items:center;gap:6px;border:2px dashed var(--line);border-radius:14px;padding:14px;text-align:center;background:var(--card);cursor:pointer;font-size:13px;color:var(--ink-2)}
.photo-pick img{max-height:180px;border-radius:10px}
.photo-pick svg{width:30px;height:30px}
.err{color:var(--red);font-size:12.5px}

/* lists */
.list{display:grid;gap:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;display:grid;gap:8px}
.card .hd{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.status{display:inline-flex;align-items:center;gap:5px;border-radius:8px;padding:3px 8px;font-size:12px;font-weight:700}
.st-new{background:var(--mustard);color:#2b2a20}
.st-accepted,.st-delivering{background:var(--green-soft);color:var(--green)}
.st-done{background:var(--green);color:var(--on-green)}
.st-cancelled{background:var(--red-soft);color:var(--red)}
.track{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.track span{height:5px;border-radius:3px;background:var(--line)}
.track span.on{background:var(--green)}
.lines{font-size:13px;color:var(--ink-2);display:grid;gap:2px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.tabs2{display:grid;grid-template-columns:repeat(3,1fr);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px}
.tabs2 button{border:0;background:none;border-radius:9px;padding:8px 4px;font-size:13px;font-weight:700;color:var(--ink-2)}
.tabs2 button.on{background:var(--green);color:var(--on-green)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;display:grid;gap:2px}
.stat b{font-family:var(--f-display);font-size:18px;font-variant-numeric:tabular-nums}
.stat span{font-size:11.5px;color:var(--ink-2)}
.menu{display:grid;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.menu button{display:flex;align-items:center;gap:12px;border:0;background:none;padding:14px;text-align:left;border-top:1px solid var(--line)}
.menu button:first-child{border-top:0}
.menu button svg{width:20px;height:20px;color:var(--green);flex:none}
.menu button .go{margin-left:auto;color:var(--ink-2)}
.menu .dot{position:static}
.mini-prod{display:grid;grid-template-columns:56px 1fr auto;gap:10px;align-items:center}
.mini-prod .th{width:56px;height:48px;border-radius:8px;overflow:hidden;background:var(--art-bg)}
.mini-prod .th img,.mini-prod .th svg{width:100%;height:100%;object-fit:cover;display:block}
.empty{display:grid;justify-items:center;gap:10px;text-align:center;padding:36px 10px;color:var(--ink-2)}
.empty svg{width:56px;height:56px;color:var(--green)}
.banner{font-size:12.5px;background:var(--red-soft);color:var(--red);padding-block:8px}
.check{display:flex;gap:8px;align-items:center;font-size:14px}
.check input{width:18px;height:18px;accent-color:var(--green)}

/* tab bar */
.tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;z-index:30;background:var(--paper);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:6px max(6px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px))}
.tabbar button{border:0;background:none;display:grid;justify-items:center;gap:2px;font-size:11px;color:var(--ink-2);padding:4px 0;position:relative}
.tabbar svg{width:23px;height:23px}
.tabbar .on{color:var(--green);font-weight:700}
.tabbar .dot{top:-2px;right:calc(50% - 22px)}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:12px;font-size:14px;z-index:50;max-width:calc(100% - 32px);text-align:center}
</style>

<div class="app" id="app">
  <div id="banner"></div>
  <div id="screen"></div>
</div>
<nav class="tabbar" id="tabbar" aria-label="Разделы"></nav>
<div class="toast" id="toast" hidden></div>

<script>
/* ---------- icons ---------- */
const I = {
  home:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/></svg>',
  grid:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="4" width="7" height="7" rx="2"/><rect x="13" y="4" width="7" height="7" rx="2"/><rect x="4" y="13" width="7" height="7" rx="2"/><rect x="13" y="13" width="7" height="7" rx="2"/></svg>',

const S = { mode:'local', db:null, user:null, uid:null, owner:false, canWrite:true };
const local = {
  data: ls('localdb') || {},
  subs: [],
  save(){ ls('localdb', this.data) },
  coll(path){ return this.data[path] || (this.data[path]={}) },
  emit(path){ this.save(); this.subs.filter(s=>s.path===path).forEach(s=>s.cb(this.list(path))) },
  list(path){ return Object.entries(this.data[path]||{}).map(([id,d])=>({id,...d})) },
};
function split(p){ const i=p.lastIndexOf('/'); return [p.slice(0,i), p.slice(i+1)] }
const store = {
  listen(path, cb){
    if(S.db) return S.db.collection(path).onSnapshot(s=>cb(s.docs.map(d=>({id:d.id,...d.data()}))), e=>console.warn(path,e));
    const sub={path,cb}; local.subs.push(sub); setTimeout(()=>cb(local.list(path))); return ()=>{local.subs=local.subs.filter(x=>x!==sub)};
  },
  async set(path, data){
    if(S.db) return S.db.doc(path).set(data);
    const [c,id]=split(path); local.coll(c)[id]=JSON.parse(JSON.stringify(data)); local.emit(c);
  },
  async update(path, patch){
    if(S.db) return S.db.doc(path).update(patch);
    const [c,id]=split(path); local.coll(c)[id]={...local.coll(c)[id],...patch}; local.emit(c);
  },
  async del(path){
    if(S.db) return S.db.doc(path).delete();
    const [c,id]=split(path); delete local.coll(c)[id]; local.emit(c);
  },
};

/* Supabase backend for the GitHub Pages build: one table «docs» (coll, id, data) shaped like the Claude db */
function supabaseDb(sb){
  const watchers=new Map(); // coll -> Set of reload functions
  sb.channel('docs-all').on('postgres_changes',{event:'*',schema:'public',table:'docs'},pl=>{
    const c=(pl.new&&pl.new.coll)||(pl.old&&pl.old.coll); if(!c){ watchers.forEach(set=>set.forEach(f=>f())); return }
    (watchers.get(c)||[]).forEach(f=>f());
  }).subscribe();
  const err=e=>{ const x=new Error(e.message); x.code= e.code==='42501'||/row-level security/i.test(e.message)?'invalid_argument':'unavailable'; return x };
  const doc=path=>{ const [coll,id]=split(path); return {
    async set(data){ const {error}=await sb.from('docs').upsert({coll,id,data}); if(error) throw err(error) },
    async update(patch){ const r=await sb.from('docs').select('data').eq('coll',coll).eq('id',id).maybeSingle(); if(r.error) throw err(r.error);
      const {error}=await sb.from('docs').upsert({coll,id,data:{...(r.data?r.data.data:{}),...patch}}); if(error) throw err(error) },
    async delete(){ const {error}=await sb.from('docs').delete().eq('coll',coll).eq('id',id); if(error) throw err(error) },
  }};
  return {
    doc,
    collection(coll){ return { onSnapshot(next, onErr){
      const load=async()=>{ const {data,error}=await sb.from('docs').select('id,data').eq('coll',coll); if(error){ onErr&&onErr(err(error)); return }
        next({docs:data.map(r=>({id:r.id,data:()=>r.data}))}) };
      if(!watchers.has(coll)) watchers.set(coll,new Set()); watchers.get(coll).add(load); load();
      const t=setInterval(load,60000); // safety net if realtime drops
      return ()=>{ watchers.get(coll).delete(load); clearInterval(t) };
    }}},
  };
}
/* Google Sheets backend (Apps Script web app): polls the whole table, writes with POST */
function sheetsDb(url){
  let cache=null, timer=null; const subs=new Map();
  const snap=coll=>({docs:((cache&&cache[coll])||[]).map(d=>({id:d.id,data:()=>d.data}))});
  async function pull(){
    const r=await fetch(url+(url.includes('?')?'&':'?')+'action=all&t='+Date.now()); const j=await r.json(); if(!j.ok) throw new Error(j.error||'Таблица не ответила');
    cache={}; j.docs.forEach(d=>(cache[d.coll] ||= []).push({id:d.id,data:d.data}));
    subs.forEach((set,coll)=>{ const sig=JSON.stringify(cache[coll]||[]); set.forEach(s=>{ if(s.sig!==sig){ s.sig=sig; s.next(snap(coll)) } }) });
  }
  async function post(body){
    const r=await fetch(url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({...body,key:ls('adminKey')||'',uid:S.uid})});
    const j=await r.json(); if(!j.ok){ const e=new Error(j.error); e.code=j.code||'unavailable'; throw e }
    await pull().catch(()=>{});
  }
  return {
    pull,
    async checkAdmin(key){ const r=await fetch(url+(url.includes('?')?'&':'?')+'action=admin&key='+encodeURIComponent(key)); return !!(await r.json()).ok },
    batch:writes=>post({op:'batch',writes}),
    doc(path){ const [coll,id]=split(path); return { set:data=>post({op:'set',coll,id,data}), update:data=>post({op:'update',coll,id,data}), delete:()=>post({op:'delete',coll,id}) } },
    collection(coll){ return { onSnapshot(next){
      const s={next,sig:null}; if(!subs.has(coll)) subs.set(coll,new Set()); subs.get(coll).add(s);
      if(cache){ s.sig=JSON.stringify(cache[coll]||[]); setTimeout(()=>next(snap(coll))) }
      if(!timer) timer=setInterval(()=>{ if(!document.hidden) pull().catch(e=>console.warn(e)) },15000);
      return ()=>subs.get(coll).delete(s);
    }}},
  };
}

async function bootSupabase(cfg){
  const sb=window.supabase.createClient(cfg.url,cfg.anonKey);
  let {data:{session}}=await sb.auth.getSession();
  if(!session){ const r=await sb.auth.signInAnonymously(); if(r.error) throw r.error; session=r.data.session }
  S.mode='supabase'; S.sb=sb; S.db=supabaseDb(sb); S.uid=session.user.id;
  const a=await sb.from('admins').select('uid').eq('uid',S.uid).maybeSingle(); S.owner=!!(a.data);
}

function visibleProducts(){
  let list = allProducts().filter(p=>p.active!==false);
  if(st.cat!=='all') list=list.filter(p=>p.category===st.cat);
  const q=st.q.trim().toLowerCase();
  if(q) list=list.filter(p=>(p.name+' '+p.farm.name+' '+catName(p.category)).toLowerCase().includes(q));
  if(st.sort==='cheap') list.sort((a,b)=>a.price-b.price);
  else if(st.sort==='fresh') list.sort((a,b)=>(b.harvestDate||'').localeCompare(a.harvestDate||''));
  else list.sort((a,b)=>(isVerified(b.farmId)-isVerified(a.farmId)) || (b.harvestDate||'').localeCompare(a.harvestDate||''));
  return list;
}

/* cart: one delivery = one farmer, so one order holds one farm's goods; the rest wait in the cart */
function cartGroups(){
  const g={};
  st.cart.forEach(i=>{ const p=findProd(i.key); if(!p) return; (g[p.farmId] ||= {farm:p.farm, farmId:p.farmId, items:[]}).items.push({...i, p}); });
  return Object.values(g).map(x=>({...x, sum:x.items.reduce((s,i)=>s+i.p.price*i.qty,0)}));
}
function orderGroup(){
  const gs=cartGroups(); if(!gs.length) return null;
  return gs.find(g=>g.farmId===st.orderFarm) || gs[0];
}
function nextDays(){ const out=[]; for(let i=1;i<=4;i++){ const d=new Date(); d.setDate(d.getDate()+i); out.push(d) } return out }
function steps(n){ const L=['Корзина','Доставка','Оплата','Подтверждение']; return `<div class="steps">${L.map((l,i)=>`<div class="${i<=n?'on':''}"><i>${i<n?I.check.replace('<svg','<svg width="14" height="14"'):i+1}</i>${l}</div>`).join('')}</div>` }

      <div class="gh">${multi?`<label class="pick"><input type="radio" name="ofarm" data-act="ofarm" data-v="${g.farmId}" ${on?'checked':''}><b>${esc(g.farm.name)}</b></label>`:`<b>${esc(g.farm.name)}</b>`}<span class="muted">${multi&&!on?'останется в корзине':'привезёт фермер'}</span></div>
      ${g.items.map(i=>`<div class="ci-row"><div class="th">${pimg(i.p)}</div><div class="nm">${esc(i.p.name)}<div class="muted small" style="font-weight:400">${esc(i.p.unit)} · ${esc(g.farm.name)}</div></div>

    <div class="total"><h3>Итого${multi?' по заказу':''}</h3><span class="price num">${rub(sel.sum)}</span></div>

function orderCard(o, farmer=false){
  const lines=o.items.map(i=>`<span>${esc(i.name)} × ${i.qty} — ${rub(i.price*i.qty)}</span>`).join('');
  const acts=[];
  if(farmer){
    if(o.status==='new') acts.push(['accepted','Принять','green'],['cancelled','Отклонить','danger']);
    if(o.status==='accepted') acts.push(['delivering','Выехал к покупателю','green']);

/* ---------- actions ---------- */
function addToCart(key,n){ const it=st.cart.find(i=>i.key===key); if(it) it.qty+=n; else st.cart.push({key,qty:n}); saveCart(); }
document.addEventListener('click', async e=>{
  const b=e.target.closest('[data-act]'); if(!b) return;
  const a=b.dataset.act, v=b.dataset.v;
  if(a==='tab') return tab(v);
  if(a==='back') return back();
  if(a==='go'){ if(v==='product-form'||v==='farm-form'){ pendingPhoto=null; st.stack.push({view:v,param:b.dataset.p||null}); return render(true) } return go(v) }
  if(a==='prod'){ st.pq=1; return go('prod',v) }
  if(a==='farm') return go('farm',v);
  if(a==='cat'){ st.cat=v; if(st.tab!=='catalog'){ st.tab='catalog'; st.stack=[] } return render(st.tab!=='catalog') }
  if(a==='fav'){ st.favs = st.favs.includes(v)? st.favs.filter(x=>x!==v) : [...st.favs,v]; ls('favs',st.favs); return render(false) }
  if(a==='add'){ addToCart(v,1); toast('Добавлено в корзину'); return render(false) }
  if(a==='pq'){ st.pq=Math.max(1,(st.pq||1)+Number(v)); return render(false) }
  if(a==='addq'){ addToCart(v,st.pq||1); st.pq=1; toast('Добавлено в корзину'); return render(false) }
  if(a==='cq'){ const [k,d]=v.split('|'); const it=st.cart.find(i=>i.key===k); if(it){ it.qty+=Number(d); if(it.qty<1) st.cart=st.cart.filter(i=>i!==it) } saveCart(); return render(false) }
  if(a==='ofarm'){ st.orderFarm=v; return render(false) }
  if(a==='rm'){ st.cart=st.cart.filter(i=>i.key!==v); saveCart(); return render(false) }
  if(a==='day'){ readCheckout(); st.checkout.day=v; return render(false) }
  if(a==='paym'){ st.checkout.pay=v; return render(false) }
  if(a==='ftab'){ st.ftab=v; return render(false) }
  if(a==='cancelnew'){ st.manage=null; return render(false) }
  if(a==='seed') return seed(b);
  if(a==='verify'){ b.disabled=true; try{ await store.set('verified/'+v,{ok:!isVerified(v), at:Date.now()}); toast(isVerified(v)?'Отметка снята':'Ферма отмечена проверенной') }catch(err){ fail(err) } return }
  if(a==='ost'){ const [id,s]=v.split('|'); const o=st.orders.find(x=>x.id===id); if(!o) return; b.disabled=true;
    try{ await store.update('orders/'+id,{status:s, history:[...(o.history||[]),{s,t:Date.now()}]}); toast('Статус: '+STATUS[s]) }catch(err){ fail(err); b.disabled=false } return }
  if(a==='repeat'){ const o=st.orders.find(x=>x.id===v.split('|')[0]); let n=0; o.items.forEach(i=>{ if(findProd(o.farmId+'/'+i.pid)){ addToCart(o.farmId+'/'+i.pid,i.qty); n++ } }); toast(n?'Товары добавлены в корзину':'Этих товаров больше нет'); return tab('cart') }
  if(a==='delprod'){ if(b.dataset.sure!=='1'){ b.dataset.sure='1'; b.textContent='Нажмите ещё раз, чтобы удалить'; return }
    try{ await store.del(`farms/${st.manage}/products/${v}`); toast('Товар удалён'); back() }catch(err){ fail(err) } return }
});
document.addEventListener('input', e=>{
  if(e.target.id==='q'){ st.q=e.target.value; if(st.tab!=='catalog'&&cur().view==='home'){ st.tab='catalog'; st.stack=[] } render(false) }
});
document.addEventListener('change', async e=>{
  const t=e.target;
  if(t.id==='sort'){ st.sort=t.value; render(false) }
  if(t.id==='manage'){ st.manage=t.value; render(false) }
  if(t.id==='fp-photo' && t.files[0]){ try{ pendingPhoto=await compress(t.files[0]); readProdDraft(); render(false); restoreProdDraft() }catch(err){ toast('Не удалось прочитать фото. Попробуйте JPG или PNG.') } }
});
let prodDraft=null;
function readProdDraft(){ prodDraft={}; document.querySelectorAll('#f-prod input:not([type=file]),#f-prod select').forEach(i=>prodDraft[i.id]= i.type==='checkbox'?i.checked:i.value) }
function restoreProdDraft(){ if(!prodDraft) return; for(const id in prodDraft){ const i=document.getElementById(id); if(i){ if(i.type==='checkbox') i.checked=prodDraft[id]; else i.value=prodDraft[id] } } prodDraft=null }
function readCheckout(){
  const g=id=>document.getElementById(id); if(!g('c-name')) return;
  st.me={name:g('c-name').value.trim(),phone:g('c-phone').value.trim(),address:g('c-addr').value.trim()};
  st.checkout.slot=g('c-slot').value; st.checkout.comment=g('c-comment').value; st.checkout.weekly=g('c-weekly').checked;
}
function fail(err){ console.warn(err); toast(err&&err.code==='invalid_argument'?'Нет прав на это действие':'Не получилось сохранить. Проверьте связь и попробуйте ещё раз.') }
function showErr(id,msg){ const el=document.getElementById(id); el.textContent=msg; el.hidden=!msg; if(msg) el.scrollIntoView({block:'center',behavior:'smooth'}) }

document.addEventListener('submit', async e=>{
  e.preventDefault(); const f=e.target, g=id=>document.getElementById(id);
  if(f.id==='f-admin'){ const k=g('adm-key').value; try{ if(await S.db.checkAdmin(k)){ ls('adminKey',k); S.owner=true; toast('Вы вошли как команда'); render(false) } else toast('Неверный пароль') }catch(e){ toast('Таблица не ответила, попробуйте ещё раз') } return }
  if(f.id==='f-me'){ st.me={name:g('m-name').value.trim(),phone:g('m-phone').value.trim(),address:g('m-addr').value.trim()}; ls('me',st.me); toast('Сохранено'); return back() }
  if(f.id==='f-checkout'){
    readCheckout(); ls('me',st.me);
    if(!st.me.name||!/\d{6,}/.test(st.me.phone.replace(/\D/g,''))||st.me.address.length<5) return showErr('c-err','Заполните имя, телефон и адрес, чтобы фермер смог привезти заказ.');
    return go('pay');
  }
  if(f.id==='f-pay'){
    if(!S.canWrite) return toast('Только просмотр: заказ создать нельзя');
    const btn=g('pay-btn'); btn.disabled=true; btn.textContent='Проводим тестовый платёж…';
    const groups=[orderGroup()].filter(Boolean), ids=[];
    try{
      for(const gr of groups){
        const id=rid();
        await store.set('orders/'+id,{
          num: String(Date.now()).slice(-6)+'-'+(ids.length+1),
          buyerUid:S.uid, buyerName:st.me.name, phone:st.me.phone, address:st.me.address, comment:st.checkout.comment,
          farmId:gr.farmId, farmName:gr.farm.name,
          items: gr.items.map(i=>({pid:i.p.id,name:i.p.name,unit:i.p.unit,price:i.p.price,qty:i.qty})),
          total: gr.sum, commission: Math.round(gr.sum*COMMISSION),
          deliveryDate: st.checkout.day, slot: st.checkout.slot, weekly: st.checkout.weekly,
          status:'new', paid:true, payMethod: st.checkout.pay+' (тест)', createdAt: Date.now(), history:[{s:'new',t:Date.now()}],
        });
        ids.push(id);
      }
      const done=new Set(groups.flatMap(g=>g.items.map(i=>i.key))); st.cart=st.cart.filter(i=>!done.has(i.key)); st.orderFarm=null; saveCart(); st.checkout.day=null; st.checkout.comment='';
      st.stack=[{view:'done',param:ids}]; st.tab='cart'; render(true);
    }catch(err){ fail(err); btn.disabled=false; btn.textContent='Оплатить' }
    return;
  }
  if(f.id==='f-farm'){
    const d={name:g('ff-name').value.trim(),person:g('ff-person').value.trim(),phone:g('ff-phone').value.trim(),district:g('ff-district').value.trim(),
      km:Number(g('ff-km').value),spec:g('ff-spec').value.trim(),story:g('ff-story').value.trim(),minOrder:Number(g('ff-min').value)||0};
    if(!d.name||!d.person||!d.phone||!d.spec) return showErr('ff-err','Заполните название, контактное лицо, телефон и что вы производите.');
    if(!(d.km>=0&&g('ff-km').value!=='')) return showErr('ff-err','Укажите, сколько километров от Санкт-Петербурга до фермы.');
    if(d.story.length<60) return showErr('ff-err',`Расскажите историю фермы подробнее: сейчас ${d.story.length} из 60 символов.`);
    const id=f.dataset.id||S.uid; const prev=st.farms[id]||{};
    try{ await store.set('farms/'+id,{...prev,...d, ownerUid: prev.ownerUid||S.uid, createdAt: prev.createdAt||Date.now()});
      st.manage=id; toast(f.dataset.id?'Профиль сохранён':'Ферма зарегистрирована. Добавьте первый товар.'); st.ftab='products';
      st.stack=st.stack.filter(x=>x.view!=='farm-form'); if(cur().view!=='farmer') st.stack.push({view:'farmer'}); render(true);
    }catch(err){ fail(err) }
    return;
  }
  if(f.id==='f-prod'){
    const fid=st.manage, pid=f.dataset.id, prev=pid?(st.products[fid]||[]).find(x=>x.id===pid):null;
    const d={name:g('fp-name').value.trim(),category:g('fp-cat').value,unit:g('fp-unit').value.trim(),price:Number(g('fp-price').value),
      harvestDate:g('fp-date').value,composition:g('fp-comp').value.trim(),storage:g('fp-store').value.trim(),active:g('fp-active').checked};
    const photo=pendingPhoto||(prev&&prev.photo);
    if(!photo && !(prev&&prev.art)) return showErr('fp-err','Добавьте фото товара. Без фото покупатели не доверяют продукту.');
    if(!d.name||!d.unit) return showErr('fp-err','Укажите название и фасовку.');
    if(!(d.price>0)) return showErr('fp-err','Укажите цену больше нуля.');
    if(!d.harvestDate) return showErr('fp-err','Укажите дату сбора или производства.');
    if(d.harvestDate>todayIso()) return showErr('fp-err','Дата сбора не может быть в будущем.');
    const body={...(prev?Object.fromEntries(Object.entries(prev).filter(([k])=>k!=='id')):{}),...d,updatedAt:Date.now()};
    if(photo){ body.photo=photo; delete body.art }
    if(!prev) body.createdAt=Date.now();
    const btn=f.querySelector('button[type=submit]'); btn.disabled=true;
    try{ await store.set(`farms/${fid}/products/${pid||rid()}`,body); pendingPhoto=null; toast(prev?'Товар сохранён':'Товар опубликован в каталоге'); back() }
    catch(err){ btn.disabled=false; fail(err) }
  }
});

/* shrink a photo so it fits one document (max ~250 KB) */
function compress(file){
  return new Promise((res,rej)=>{
    const url=URL.createObjectURL(file), img=new Image();
    img.onload=()=>{ let side=900, q=.78, out='';
      for(let i=0;i<6;i++){ const k=Math.min(1,side/Math.max(img.width,img.height)); const c=document.createElement('canvas');
        c.width=Math.round(img.width*k); c.height=Math.round(img.height*k); c.getContext('2d').drawImage(img,0,0,c.width,c.height);
        out=c.toDataURL('image/jpeg',q); if(out.length<170000) break; side*=.8; q-=.06 }
      URL.revokeObjectURL(url); res(out) };
    img.onerror=()=>{ URL.revokeObjectURL(url); rej(new Error('bad image')) };
    img.src=url;
  });
}

async function seed(btn){
  btn.disabled=true; btn.textContent='Загружаем…';
  if(S.db && S.db.batch){ const w=[];
    for(const [id,x] of Object.entries(seedData())){ w.push({op:'set',coll:'farms',id,data:{...x.farm,createdAt:Date.now()}});
      x.products.forEach(({id:pid,...rest})=>w.push({op:'set',coll:`farms/${id}/products`,id:pid,data:{...rest,active:true,createdAt:Date.now()}}));
      if(x.verified) w.push({op:'set',coll:'verified',id,data:{ok:true,at:Date.now()}}) }
    try{ await S.db.batch(w); toast('Примеры загружены') }catch(err){ fail(err); btn.disabled=false } return }
  try{ for(const [id,x] of Object.entries(seedData())){
      await store.set('farms/'+id,{...x.farm,createdAt:Date.now()});
      for(const p of x.products){ const {id:pid,...rest}=p; await store.set(`farms/${id}/products/${pid}`,{...rest,active:true,createdAt:Date.now()}) }
      if(x.verified) await store.set('verified/'+id,{ok:true,at:Date.now()});
    } toast('Примеры загружены'); }
  catch(err){ fail(err); btn.disabled=false }
}

/* ---------- boot ---------- */
function attach(){
  store.listen('farms', docs=>{
    st.farms=Object.fromEntries(docs.map(({id,...d})=>[id,d])); st.loaded=true;
    for(const id in st.farms) if(!prodSubs[id]) prodSubs[id]=store.listen(`farms/${id}/products`, ps=>{ st.products[id]=ps; softRender() });
    for(const id in prodSubs) if(!st.farms[id]){ prodSubs[id](); delete prodSubs[id]; delete st.products[id] }
    softRender();
  });
  store.listen('verified', docs=>{ st.verified=Object.fromEntries(docs.map(({id,...d})=>[id,d])); softRender() });
  store.listen('orders', docs=>{ st.orders=docs; softRender() });
}
async function boot(){
  render(false);
  let db=null, user=null;
  const C=window.GRABELKA_CONFIG||{};
  if(C.backend==='sheets' && C.sheetsUrl){
    try{ S.db=sheetsDb(C.sheetsUrl); await S.db.pull(); S.mode='sheets';
      S.uid = ls('uid') || (()=>{ const u='u-'+rid(); ls('uid',u); return u })();
      if(ls('adminKey')) S.owner = await S.db.checkAdmin(ls('adminKey')).catch(()=>false);
      attach(); render(false); return }
    catch(e){ console.warn('sheets',e); S.mode='local'; S.db=null; S.sbError='Google Таблица не ответила ('+(e.message||e)+')' }
  }
  const cfg = C.backend==='supabase' ? {url:C.supabaseUrl, anonKey:C.supabaseAnonKey} : window.GRABELKA_SUPABASE;
  if(cfg && cfg.url && cfg.anonKey && window.supabase){
    try{ await bootSupabase(cfg); attach(); render(false); return }
    catch(e){ console.warn('supabase',e); S.mode='local'; S.db=null; S.sbError=e.message||String(e) }
  }
  if(window.claude && typeof window.claude.use==='function'){
    try{ [db,user]=await Promise.all([window.claude.use('db'), window.claude.use('user')]) }catch(e){}
  }
  if(db && user){
    S.mode='db'; S.db=db; S.user=user;
    try{ S.uid=await user.id() }catch(e){}
    try{ S.owner=!!(await user.isOwner()) }catch(e){}
    try{ const w=await user.can('data.write'); S.canWrite = w!==false }catch(e){}
    if(!S.uid){ S.mode='local'; S.db=null }
  }
  if(S.mode==='local'){ S.uid = ls('uid') || (()=>{ const u='local-'+rid(); ls('uid',u); return u })(); }
  if(S.mode==='local' && !Object.keys(local.data.farms||{}).length && !ls('seeded')){ ls('seeded',true); await seedSilently() }
  attach(); render(false);
}
async function seedSilently(){ // demo build without a database opens with example farms already in place
  for(const [id,x] of Object.entries(seedData())){
    await store.set('farms/'+id,{...x.farm,createdAt:Date.now()});
    for(const p of x.products){ const {id:pid,...rest}=p; await store.set(`farms/${id}/products/${pid}`,{...rest,active:true,createdAt:Date.now()}) }
    if(x.verified) await store.set('verified/'+id,{ok:true,at:Date.now()});
  }
}
boot();
