  function ownerIds(cart,products){const byId=new Map(products.map(p=>[p.id,p]));return [...new Set(cart.map(l=>byId.get(l.id)?.sellerId).filter(Boolean))];}
  function validCart(cart,products){return Array.isArray(cart)&&cart.length>0&&cart.every(l=>products.some(p=>p.id===l.id)&&Number.isInteger(l.qty)&&l.qty>0&&l.qty<=cap)&&ownerIds(cart,products).length===1;}
  function addLines(cart,lines,products){
    const clean=sanitizeCart(cart,products), incoming=sanitizeCart(lines,products);
    if(!incoming.length)return {ok:false,reason:'empty',cart:clean};
    if(ownerIds(incoming,products).length!==1)return {ok:false,reason:'mixed-addition',cart:clean};
    if(ownerIds(clean.concat(incoming),products).length>1)return {ok:false,reason:'different-seller',cart:clean};
    const map=new Map(clean.map(l=>[l.id,l.qty]));
    for(const line of incoming){const qty=(map.get(line.id)||0)+line.qty;if(qty>cap)return {ok:false,reason:'limit',cart:clean};map.set(line.id,qty);}
    return {ok:true,cart:[...map].map(([id,qty])=>({id,qty}))};
  }
  function setQuantity(cart,id,qty,products){if(!Number.isInteger(qty))return sanitizeCart(cart,products);return sanitizeCart(cart.map(l=>l.id===id?{id,qty:Math.max(0,Math.min(cap,qty))}:l).filter(l=>l.qty>0),products);}
  function total(cart,products){const lookup=new Map(products.map(p=>[p.id,p.price]));return cart.reduce((n,l)=>n+(lookup.get(l.id)||0)*l.qty,0);}
  function count(cart){return cart.reduce((n,l)=>n+l.qty,0);}
  function packageLines(pack,size){return (pack.sizes[String(size)]||[]).map(([id,qty])=>({id,qty}));}
  return {sanitizeCart,ownerIds,validCart,addLines,setQuantity,total,count,packageLines,cap};
});

div><span class="hero-image-label">Иллюстрация из макета</span></section><div class="categories-home">${D.categories.slice(1).map(c=>`<button class="category-home" data-action="category-home" data-id="${c.id}"><img src="${c.image}" alt=""><span>${c.label}</span></button>`).join('')}</div>${homeSets()}<section class="home-pack"><span class="pack-decoration">${icon('basket')}</span><div class="eyebrow">Для вашей семьи</div><h2>Маленькое удовольствие.<br>Большая корзина.</h2><p>Три варианта набора на 3, 4 или 5 человек.<br>Или только то, что любите вы.</p><div class="home-pack-links"><a class="btn" href="#/packages">Выбрать набор ${icon('arrow')}</a><a class="btn secondary" href="#/builder">Собрать свой</a></div></section><section class="section pad"><div class="section-head"><h2>Фермеры рядом</h2><a class="text-link" href="#/farmers">Все фермеры ${icon('arrow')}</a></div><div class="farm-mini-grid">${D.farmers.map(farmMini).join('')}</div></section><section class="section pad"><div class="section-head"><h2>Рекомендуем попробовать</h2><a class="text-link" href="#/catalog">Все товары ${icon('arrow')}</a></div><div class="recommend-grid">${['milk','eggs','beef'].map(id=>productCard(product(id),{mini:true})).join('')}</div></section><div class="pad"><a class="map-teaser" href="#/farmers">${icon('map')}<span><strong>Знакомьтесь с фермерами</strong><small>Карта и профили из открытого каталога</small></span>${icon('chevron')}</a></div>${demoNote()}<div class="footer-links"><button data-action="how">Как это работает</button><button data-action="sources">Источники данных</button></div>`;}
function filteredProducts(){const f=S.filters;return D.products.filter(p=>(f.category==='all'||p.category===f.category)&&(!f.seller||p.sellerId===f.seller)&&(!f.query||`${p.name} ${seller(p.sellerId).name}`.toLocaleLowerCase('ru').includes(f.query.toLocaleLowerCase('ru')))&&(f.min===''||p.price>=Number(f.min))&&(f.max===''||p.price<=Number(f.max))).sort((a,b)=>f.sort==='asc'?a.price-b.price:f.sort==='desc'?b.price-a.price:b.rank-a.rank);}
function productResults(){const items=filteredProducts();return items.length?items.map(p=>productCard(p)).join(''):`<div class="empty">${icon('search')}<h2>Пока ничего нет</h2><p>В этой категории ещё нет позиций из вашей таблицы. Попробуйте другой филтр.</p><button class="btn secondary" data-action="reset-filters">Показать все товары</button></div>`;}
function activeFilters(){return [S.filters.seller?`<button class="filter-token" data-action="clear-seller">${esc(seller(S.filters.seller)?.short)} \u00d7</button>`:'',S.filters.query?`<button class="filter-token" data-action="clear-query">${esc(S.filters.query)} \u00d7</button>`:'',S.filters.min||S.filters.max?`<button class="filter-token" data-action="clear-price">${S.filters.min||0}\u2013${S.filters.max||'\u221e'} \u20bd \u00d7</button>`:''].join('');}
function searchedFarmers(){const q=S.filters.query.trim().toLocaleLowerCase('ru');if(!q)return '';return D.farmers.filter(f=>`${f.name} ${f.region}`.toLocaleLowerCase('ru').includes(q)).map(f=>`<a class="search-result-farm" href="#/farmer/${f.id}">${esc(f.name)}<small>Профиль хозяйства \u00b7 ${esc(f.region)}</small></a>`).join('');}
function renderCatalog(){return `${header('Каталог',{search:true})}<div class="catalog-tabs" aria-label="Категории">${D.categories.map(c=>`<button class="chip ${S.filters.category===c.id?'active':''}" data-action="category" data-id="${c.id}" aria-pressed="${S.filters.category===c.id}">${c.label}</button>`).join('')}</div><div class="catalog-toolbar"><button class="filter-btn" data-action="filters">${icon('filter')}Фильтры ${icon('down')}</button><select class="sort-select" id="sort" aria-label="Сортировка"><option value="default" ${S.filters.sort==='default'?'selected':''}>Порядок каталога</option><option value="asc" ${S.filters.sort==='asc'?'selected':''}>Сначала дешевле</option><option value="desc" ${S.filters.sort==='desc'?'selected':''}>Сначала дороже</option></select><button class="icon-btn" data-action="view-toggle" aria-label="${S.filters.view==='grid'?'Показать списком':'Показать сеткой'}">${icon(S.filters.view==='grid'?'list':'grid')}</button></div><div class="active-filters" id="active-filters">${activeFilters()}</div><div id="farmer-results">${searchedFarmers()}</div><div class="product-grid ${S.filters.view==='list'?'list-view':''}" id="product-results">${productResults()}</div><div class="catalog-extra"><a class="btn secondary" href="#/packages">${icon('basket')}Готовые наборы</a><a class="btn secondary" href="#/builder">${icon('plus')}Собрать свой</a></div>${demoNote()}`;}
function refreshCatalog(){if(!$('#product-results'))return;$('#product-results').innerHTML=productResults();$('#product-results').classList.toggle('list-view',S.filters.view==='list');$('#active-filters').innerHTML=activeFilters();$('#farmer-results').innerHTML=searchedFarmers();save();}
function renderProduct(id){const p=product(id);if(!p)return notFound();const f=seller(p.sellerId),fav=S.favorites.includes(id);return `<section class="detail-photo"><img src="${p.detailImage||p.image}" alt="${esc(p.name)} - иллюстрация"><div class="detail-top"><button class="icon-btn" data-action="back" aria-label="Назад">${icon('back')}</button><div class="right"><button class="icon-btn ${fav?'selected':''}" data-action="favorite" data-id="${p.id}" aria-pressed="${fav}" aria-label="В избранное">${icon('heart')}</button><button class="icon-btn" data-action="share" data-id="${p.id}" aria-label="Поделиться товаром">${icon('share')}</button></div></div><span class="photo-caption">Иллюстративное изображение</span></section><div class="detail-body"><h1>${esc(p.name)}</h1><p class="detail-sub">${esc(p.unit)} \u00b7 учебная витрина</p><div class="detail-price">${money(p.price)}</div><div class="detail-buy"><div class="stepper"><button data-action="detail-qty" data-delta="-1" aria-label="Уменьшить количество">${icon('minus')}</button><span id="detail-qty">${S.detailQty}</span><button data-action="detail-qty" data-delta="1" aria-label="Увеличить количество">${icon('plus')}</button></div><button class="btn" data-action="detail-add" data-id="${id}">${icon('cart')}Добавить в корзину</button></div><div class="detail-info-tiles"><div class="info-tile">${icon('calendar')}<div><strong>Дата производства</strong><small>Уточняется у фермера</small></div></div><div class="info-tile">${icon('truck')}<div><strong>Один фермер</strong><small>Одна доставка</small></div></div></div><div class="info-row">${icon('document')}<div><strong>Состав</strong><p>Нет подтверждённых данных. Указывается после подключения поставщика.</p></div></div><div class="info-row">${icon('leaf')}<div><strong>Условия хранения</strong><p>Срок годности и температура хранения должны быть уточнены по упаковке.</p></div></div><div class="info-row">${icon('truck')}<div><strong>Доставка</strong><p>Заказ доставляет сам фермер. В прототипе даты и интервалы тестовые.</p></div></div><div class="line"></div><h2>О продавце</h2><div class="seller-detail"><img src="${f.image}" alt="Иллюстрация тестового хозяйства"><div><h3>${esc(f.short)}</h3><p>Демонстрационный профиль</p><p>Не связан с реальной фермой</p></div><button class="btn outline" data-action="seller-catalog" data-id="${f.id}">Продукты</button></div><div class="notice">${icon('info')}<div>Цена из таблицы: <strong>${money(p.price)}</strong>. Это не предложение реального хозяйства.<br><button class="text-link" data-action="product-source" data-id="${p.id}">Откуда данные ${icon('arrow')}</button></div></div><div class="trust-tiles"><div class="trust-tile">${icon('document')}Источник<br>указан</div><div class="trust-tile">${icon('basket')}Один заказ<br>один фермер</div><div class="trust-tile">${icon('lock')}Без реальной<br>оплаты</div></div><a class="btn secondary full" style="margin-top:18px" href="#/cart">${icon('cart')}Открыть корзину (<span id="detail-cart-count">${C.count(S.cart)}</span>)</a></div>${demoNote()}`;}
function steps(stage){return `<div class="checkout-steps" aria-label="Этапы заказа">${[['cart','Корзина'],['truck','Доставка'],['credit','Оплата'],['check','Подтверждение']].map(([ic,label],i)=>`<div class="checkout-step ${i<=stage?'active':''}" ${i===stage?'aria-current="step"':''}><span class="step-dot">${icon(ic)}</span><span>${label}</span></div>`).join('')}</div>`;}
function dateOptions(){return Array.from({length:4},(_,i)=>{const d=new Date();d.setDate(d.getDate()+i+1);return {label:i===0?'Завтра':d.toLocaleDateString('ru-RU',{weekday:'short'}),value:d.toLocaleDateString('ru-RU',{day:'numeric',month:'short'}),iso:`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};});}
function delivery(){fixDate();return `<div class="delivery-head">${icon('truck')}<span>Доставка</span><button data-action="delivery-info">Условия</button></div><div class="date-options" aria-label="Дата доставки">${dateOptions().map((d,i)=>`<button class="date-option ${S.date===i?'selected':''}" data-action="date" data-id="${i}" aria-pressed="${S.date===i}" ${deliversOn(cartSeller(),i)?'':'disabled style="opacity:.4"'}><strong>${esc(d.label)}</strong><span>${esc(d.value)}</span></button>`).join('')}</div><label class="slot-select">${icon('clock')}<select id="delivery-slot" aria-label="Интервал доставки">${['10:00 \u2013 14:00','14:00 \u2013 18:00','18:00 \u2013 21:00'].map(s=>`<option ${S.slot===s?'selected':''}>${s}</option>`).join('')}</select></label><p class="helper">Серые даты: хозяйство в этот день не возит в ${esc(F.district||'ваш район')}. Расписание и интервалы — пример, не реальные хозяйства.</p>`;}
function cartRow(l){const p=product(l.id);return `<article class="cart-row" data-cart-item="${p.id}"><a href="#/product/${p.id}"><img src="${p.image}" alt="${esc(p.name)}"></a><div><a class="cart-item-title" href="#/product/${p.id}">${esc(p.name)}</a><p class="cart-item-unit">${esc(p.unit)} \u00b7 ${esc(seller(p.sellerId).short)}</p></div><div class="cart-row-right"><div class="stepper"><button data-action="cart-qty" data-id="${p.id}" data-delta="-1" aria-label="Уменьшить: ${esc(p.name)}">${icon('minus')}</button><span>${l.qty}</span><button data-action="cart-qty" data-id="${p.id}" data-delta="1" aria-label="Увеличить: ${esc(p.name)}">${icon('plus')}</button></div><strong class="cart-row-price">${money(p.price*l.qty)}</strong></div><button class="remove-item" data-action="remove" data-id="${p.id}" aria-label="Удалить: ${esc(p.name)}">${icon('trash')}</button></article>`;}
function conflictNotice(){if(!S.pending)return '';const current=seller(C.ownerIds(S.cart,D.products)[0]);const next=seller(C.ownerIds(S.pending,D.products)[0]);return `<div class="notice warn error" role="alert" id="cart-conflict">${icon('warning')}<div><strong>В корзине товары другого фермера</strong><p>${esc(current?.short||'Текущий заказ')} \u2192 ${esc(next?.short||'Другой фермер')}. Один заказ доставляет один фермер. Текущая корзина не изменена.</p><button class="btn secondary full" data-action="keep-cart">Оставить текущую корзину</button><button class="btn full" data-action="confirm-replace" style="margin-left:0">Начать заказ у другого фермера</button></div></div>`;}
function renderCart(){const owner=C.ownerIds(S.cart,D.products),mixed=owner.length>1;return `${header('Ваша корзина',{cart:false,sub:'Продукты для вас и вашей семьи'})}<div class="pad">${steps(0)}${conflictNotice()}${S.cart.length?`<p class="cart-owner">${icon('leaf')} ${esc(seller(owner[0])?.name||'')} \u00b7 демо</p><div class="cart-rows">${S.cart.map(cartRow).join('')}</div><button class="add-more" data-action="add-more">${icon('plus')}Добавить ещё продукты</button><div class="notice warn">${icon('warning')}<div>Один заказ - один фермер. Продукты доставляет сам фермер.${mixed?`<strong style="display:block">В сохранённых данных смешаны продавцы. Очистите корзину для продолжения.</strong>`:''}</div></div>${setHint()}${delivery()}<div class="line"></div><div class="summary-row"><span>Продукты</span><strong>${money(C.total(S.cart,D.products))}</strong></div>${discountRow()}<div class="summary-row"><span>Доставка</span><span>Уточняется</span></div><div class="cart-dock"><div class="summary-row total"><span>Итого за продукты</span><strong data-total>${money(cartTotal())}</strong></div><p class="small muted">Комиссия сервиса уже в цене.</p>${minOrderNotice()}<div class="cart-bottom-action"><button class="btn full" data-action="checkout" ${mixed||cartTotal()<MIN_ORDER?'disabled':''}>Перейти к оформлению ${icon('arrow')}</button></div><p class="cart-demo-caption">Тестовый заказ: оплата не списывается.</p></div><div class="cart-tools"><button data-action="clear-cart">Очистить корзину</button><a class="text-link" href="#/packages">Семейные наборы</a></div>`:`<div class="empty">${icon('basket')}<h2>Здесь будет вкусно</h2><p>Выберите готовый набор для семьи или соберите свое из любимых продуктов.</p><div class="empty-actions"><a class="btn" href="#/catalog">В каталог</a><a class="btn secondary" href="#/packages">Выбрать набор</a></div></div>`}</div>${demoNote()}`;}
function renderCheckout(){if(!C.validCart(S.cart,D.products))return renderCart();return `${header('Доставка',{cart:false,sub:'Тестовое оформление заказа'})}<div class="pad">${steps(1)}<p class="form-intro">Заказ уйдёт фермеру в тестовую Google Таблицу. Вводите только тестовые данные.</p><form id="checkout-form" novalidate><label class="field" data-field="name"><span>Имя получателя</span><input name="name" autocomplete="given-name" maxlength="60" value="${esc(S.address.name)}" placeholder="Как к вам обращаться" required><span class="form-error" id="error-name"></span></label><label class="field" data-field="phone"><span>Телефон</span><input name="phone" type="tel" inputmode="tel" autocomplete="tel" maxlength="22" value="${esc(S.address.phone)}" placeholder="+7 (___) ___-__-__" required><span class="form-error" id="error-phone"></span></label><label class="field" data-field="address"><span>Адрес доставки в СПб</span><input name="address" autocomplete="street-address" maxlength="200" value="${esc(S.address.address)}" placeholder="Улица, дом, квартира" required><span class="form-error" id="error-address"></span></label>${delivery()}<div class="notice">${icon('info')}<span>Зона и стоимость реальной доставки пока не подтверждены. Этот шаг проверяет только сценарий интерфейса.</span></div>${discountRow()}<div class="summary-row total"><span>К оплате</span><strong>${money(cartTotal())}</strong></div><button class="btn full" type="submit">Перейти к тестовой оплате ${icon('arrow')}</button></form></div>`;}
function renderPayment(){if(!C.validCart(S.cart,D.products)||!S.checkoutValid)return `<div class="pad">${header('Оплата',{cart:false})}<div class="empty">${icon('truck')}<h2>Сначала доставка</h2><p>Заполните контактные данные для тестового заказа.</p><a class="btn" href="#/checkout">К оформлению</a></div></div>`;return `${header('Тестовая оплата',{cart:false})}<div class="pad">${steps(2)}<div class="payment-demo">${icon('lock')}<h2>Это безопасный тест</h2><p>Банковская карта не нужна. Деньги не списываются. Кнопка «Сымитировать отказ банка» показывает, что будет при неудачной оплате. Имя, телефон и адрес уйдут фермеру в тестовую Google Таблицу.</p></div><div class="summary-row"><span>Позиций в корзине</span><strong>${C.count(S.cart)}</strong></div><div class="summary-row"><span>Доставка</span><strong>${esc(dateOptions()[S.date].value)} \u00b7 ${esc(S.slot)}</strong></div><div class="summary-row"><span>Тариф доставки</span><span>Не рассчитан</span></div>${discountRow()}<div class="summary-row total"><span>К оплате</span><strong>${money(cartTotal())}</strong></div>${payFailBlock()}<button class="btn full" data-action="complete-order">${FM.payFails?'Оплатить снова'+(FM.payMethod==='sbp'?' через СБП':FM.payMethod==='card2'?' другой картой':''):'Подтвердить тестовый заказ'} ${icon('check')}</button><button class="text-link" style="margin-top:12px" data-action="pay-fail">${icon('warning')}Сымитировать отказ банка</button><button class="text-link" style="margin-top:12px" data-action="nav" data-route="checkout">${icon('back')}Изменить доставку</button></div>`;}
function renderSuccess(){const o=S.lastOrder||S.orders[0];if(!o)return notFound();return `${header('Готово',{cart:false})}<div class="pad">${steps(3)}</div><div class="order-confirmation"><div class="confirmation-icon">${icon('check')}</div><h1>Заказ принят</h1><p>Привезём ${esc(o.delivery||'')}${o.slot?', '+esc(o.slot):''}.<br>Оплата тестовая, деньги не списывались.</p><div class="order-code">${esc(o.id)}</div>${o.set?`<div class="summary-row"><span>Набор</span><strong>${esc(o.set)}</strong></div>`:''}<div class="summary-row"><span>Продукты</span><strong>${money(o.total)}</strong></div><div class="summary-row"><span>Количество</span><strong>${C.count(o.lines)} ед.</strong></div>${registerCard(o)}<a class="btn full" href="#/home">На главную ${icon('arrow')}</a><a class="text-link" href="#/profile" style="margin-top:14px">История тестовых заказов</a></div>`;}
function renderPackages(){return `${header('Семейные наборы') }<div class="pad"><p class="form-intro">Три варианта на выбор. Один набор - одно тестовое хозяйство. Без подписки.</p>${F.farm&&!D.packages.some(p=>p.sellerId===F.farm)?`<div class="notice warn">${icon('info')}<div>У ${esc(seller(F.farm)?.name||'')} пока нет готовых наборов. <a class="text-link" href="#/builder">Собрать свою корзину</a></div></div>`:''}<div class="family-tabs" aria-label="Размер семьи">${[3,4,5].map(n=>`<button class="family-tab ${S.size===n?'active':''}" data-action="family-size" data-id="${n}" aria-pressed="${S.size===n}">${n} ${n===5?'человек':'человека'}</button>`).join('')}</div>${D.packages.map(pack=>{const lines=C.packageLines(pack,S.size);return `<article class="pack-card" data-package="${pack.id}"><div class="pack-hero"><div class="pack-copy"><span class="eyebrow">${esc(pack.tag)}</span><h2>${esc(pack.name)}</h2><p>${esc(pack.subtitle)}</p></div><img src="${pack.photo}" alt="Иллюстрация набора" loading="lazy"></div><div class="pack-body"><div class="pack-contents">${lines.map(l=>`<span>${esc(product(l.id).name)} \u00b7 ${l.qty} \u00d7 ${esc(product(l.id).unit)}</span>`).join('')}</div><div class="pack-price"><div><strong>${money(SET_PRICE[S.size])}</strong> <s style="color:var(--muted);font-size:12px">${money(C.total(lines,D.products))}</s><small>выгоднее на ${money(C.total(lines,D.products)-SET_PRICE[S.size])} · ${S.size} ${S.size===5?'человек':'человека'} \u00b7 тестовый состав</small></div><button class="btn" data-action="add-pack" data-id="${pack.id}">В корзину ${icon('plus')}</button></div><button class="pack-customize" data-action="customize-pack" data-id="${pack.id}">Изменить состав \u2192</button></div></article>`;}).join('')}<a class="btn secondary full" href="#/builder">${icon('plus')}Собрать свой пакет</a><div class="notice">${icon('info')}<span>Составы - учебные комбинации позиций из таблицы. Не реальные предложения фермеров и не расчёт рациона на неделю.</span></div></div>`;}
function builderRow(p){const qty=S.builder.items.find(l=>l.id===p.id)?.qty||0;return `<article class="builder-row" data-builder-product="${p.id}"><a href="#/product/${p.id}"><img src="${p.image}" alt="${esc(p.name)}"></a><div><h3>${esc(p.name)}</h3><p>${esc(p.unit)} \u00b7 ${money(p.price)}</p></div><div class="stepper"><button data-action="builder-qty" data-id="${p.id}" data-delta="-1" aria-label="Уменьшить: ${esc(p.name)}" ${qty===0?'disabled':''}>${icon('minus')}</button><span>${qty}</span><button data-action="builder-qty" data-id="${p.id}" data-delta="1" aria-label="Увеличить: ${esc(p.name)}">${icon('plus')}</button></div></article>`;}

/* A tiny, dependency-free Web Mercator map. Network tiles are optional. */
function initMap(){
 const view=$('#map-viewport');if(!view)return;
 const tileLayer=view.querySelector('.map-tiles'), markerLayer=view.querySelector('.map-markers'),fallback=$('.map-fallback');
 let zoom=8,center=[59.86,30.18],drag=null,loaded=false,timer=null,dead=false;
 const tileCache=new Map();
 const project=(lat,lng,z)=>{const s=256*2**z;const y=Math.sin(Math.min(85,Math.max(-85,lat))*Math.PI/180);return [(lng+180)/360*s,(.5-Math.log((1+y)/(1-y))/(4*Math.PI))*s];};
 const unproject=(x,y,z)=>{const s=256*2**z;const n=Math.PI-2*Math.PI*y/s;return [180/Math.PI*Math.atan(Math.sinh(n)),x/s*360-180];};
 function draw(){if(dead||!view.isConnected)return;const w=view.clientWidth,h=view.clientHeight,[cx,cy]=project(...center,zoom),left=cx-w/2,top=cy-h/2;const needed=new Set();
  for(let x=Math.floor(left/256);x<=Math.floor((left+w)/256);x++)for(let y=Math.floor(top/256);y<=Math.floor((top+h)/256);y++){
   if(y<0||y>=2**zoom)continue;const wrapX=((x%2**zoom)+2**zoom)%2**zoom,key=`${zoom}/${wrapX}/${y}`;needed.add(key);let img=tileCache.get(key);
   if(!img){img=new Image();img.className='map-tile';img.alt='';img.draggable=false;img.decoding='async';img.referrerPolicy='strict-origin-when-cross-origin';img.onload=()=>{loaded=true;fallback.hidden=true;};img.onerror=()=>{img.style.opacity='0';if(!loaded){fallback.hidden=false;fallback.textContent='Подложка недоступна. Показана координатная схема; метки приблизительные.';}};img.src=`https://tile.openstreetmap.org/${key}.png`;tileCache.set(key,img);tileLayer.appendChild(img);}
   img.style.left=(x*256-left)+'px';img.style.top=(y*256-top)+'px';img.hidden=false;
  }
  for(const [key,img]of tileCache)if(!needed.has(key))img.hidden=true;
  markerLayer.innerHTML=D.farmers.filter(f=>f.coords).map(f=>{const [x,y]=project(...f.coords,zoom);return `<button class="map-pin ${S.selectedFarm===f.id?'active':''}" data-action="map-pin" data-id="${f.id}" style="left:${x-left}px;top:${y-top}px" aria-label="${esc(f.name)}, приблизительная точка"><span class="map-pin-label">${esc(f.name)}</span><span class="pin-circle">${icon('leaf')}</span></button>`;}).join('');
  if(!loaded){const [x,y]=project(59.94,30.31,zoom);markerLayer.insertAdjacentHTML('beforeend',`<span class="map-city" style="left:${x-left}px;top:${y-top}px">Санкт-Петербург</span>`);}
 }
 function down(e){if(e.target.closest('button'))return;drag={x:e.clientX,y:e.clientY,center:project(...center,zoom),pointer:e.pointerId};view.setPointerCapture(e.pointerId);view.classList.add('dragging');}
 function move(e){if(!drag||drag.pointer!==e.pointerId)return;center=unproject(drag.center[0]-(e.clientX-drag.x),drag.center[1]-(e.clientY-drag.y),zoom);draw();}
 function up(){drag=null;view.classList.remove('dragging');}
 function wheel(e){if(!e.ctrlKey)return;e.preventDefault();zoom=Math.max(7,Math.min(15,zoom+(e.deltaY<0?1:-1)));draw();}
 view.addEventListener('pointerdown',down);view.addEventListener('pointermove',move);view.addEventListener('pointerup',up);view.addEventListener('pointercancel',up);view.addEventListener('wheel',wheel,{passive:false});
 const resize=new ResizeObserver(draw);resize.observe(view);
 timer=setTimeout(()=>{if(!loaded&&!dead){fallback.textContent='Для географической подложки нужен интернет. Сейчас - координатная схема.';fallback.hidden=false;}},5000);
 S.map={zoom(d){zoom=Math.max(7,Math.min(15,zoom+d));draw();},fit(){zoom=8;center=[59.86,30.18];draw();},select(id){const f=farmer(id);if(f?.coords){center=f.coords.slice();zoom=10;draw();}},repaint:draw,destroy(){dead=true;clearTimeout(timer);resize.disconnect();view.removeEventListener('pointerdown',down);view.removeEventListener('pointermove',move);view.removeEventListener('pointerup',up);view.removeEventListener('pointercancel',up);view.removeEventListener('wheel',wheel);}};
 draw();
}


/* ===== Userflow (Sofia's diagram): district → delivery check → set or own basket → time → checkout → payment retry → «Заказ принят» → registration ===== */
const SET_PRICE={3:2000,4:2650,5:3300};           // fixed set prices, product prices summed are ≈5% higher
const MIN_ORDER=2000;
// Example delivery schedule (not real farms): weekdays 0=Sun..6=Sat
const SCHEDULE={'demo-a':{days:[2,4,6],districts:['Приморский район','Выборгский район','Калининский район','Петроградский район','Центральный район']},
                'demo-b':{days:[1,3,5],districts:['Московский район','Невский район','Фрунзенский район','Петроградский район','Центральный район','Калининский район']}};
const DISTRICTS=['Адмиралтейский район','Василеостровский район','Выборгский район','Калининский район','Красногвардейский район','Красносельский район','Московский район','Невский район','Петроградский район','Приморский район','Фрунзенский район','Центральный район'];
const FKEY='grabelka.flow.v1';
let F={};try{F=JSON.parse(localStorage.getItem(FKEY)||'{}')||{};}catch{F={};}
const FM={payFails:0,payMethod:'card',lastAddress:null,notifyDone:false,showOther:false};
function saveFlow(){try{localStorage.setItem(FKEY,JSON.stringify(F));}catch{}}
if(F.district)S.region=F.district;
function deliversOn(sellerId,i){const sc=SCHEDULE[sellerId];if(!sc||!F.district)return true;const d=dateOptions()[i];const wd=new Date(d.iso+'T12:00:00').getDay();return sc.days.includes(wd)&&sc.districts.includes(F.district);}
function farmDates(sellerId){return dateOptions().map((d,i)=>({...d,i})).filter(d=>deliversOn(sellerId,d.i));}
function farmsForDistrict(){return D.sellers.filter(x=>SCHEDULE[x.id]?.districts.includes(F.district)).map(x=>({seller:x,dates:farmDates(x.id)})).filter(x=>x.dates.length).sort((a,b)=>a.dates[0].i-b.dates[0].i);}
function cartSeller(){return C.ownerIds(S.cart,D.products)[0]||F.farm||'demo-a';}
function fixDate(){const sid=cartSeller();if(!deliversOn(sid,S.date)){const f=farmDates(sid)[0];if(f)S.date=f.i;}}
// sets: a set counts while the cart still holds all of its lines
function setLinesSum(lines){return C.total(lines,D.products);}
function appliedSet(){const a=F.cartSet;if(!a)return null;const pack=D.packages.find(p=>p.id===a.id);if(!pack)return null;const lines=C.packageLines(pack,a.size);
  if(!lines.every(l=>(S.cart.find(c=>c.id===l.id)?.qty||0)>=l.qty))return null;return {pack,size:a.size,lines,discount:Math.max(0,setLinesSum(lines)-SET_PRICE[a.size])};}
function cartTotal(){const a=appliedSet();return C.total(S.cart,D.products)-(a?a.discount:0);}
function discountRow(){const a=appliedSet();return a?`<div class="summary-row"><span>Набор «${esc(a.pack.name)}» на ${a.size} ${a.size===5?'человек':'человека'}</span><strong style="color:var(--green)">−${money(a.discount)}</strong></div>`:'';}
function minOrderNotice(){const t=cartTotal();return S.cart.length&&t<MIN_ORDER?`<div class="notice warn">${icon('info')}<div><strong>Минимальная сумма заказа ${money(MIN_ORDER)}</strong><p>Добавьте продуктов ещё на ${money(MIN_ORDER-t)} или выберите готовый набор.</p></div></div>`:'';}
function setHint(){
  if(!S.cart.length||appliedSet())return '';const sid=cartSeller();const ids=new Set(S.cart.map(l=>l.id));
  let best=null;for(const pack of D.packages.filter(p=>p.sellerId===sid)){const lines=C.packageLines(pack,S.size);const overlap=lines.filter(l=>ids.has(l.id)).length;if(overlap>=2&&(!best||overlap>best.overlap))best={pack,lines,overlap};}
  if(!best)return '';const full=setLinesSum(best.lines),price=SET_PRICE[S.size];
  return `<div class="notice" id="set-hint" style="background:var(--green-pale)">${icon('basket')}<div><strong>В наборе выгоднее</strong><p>«${esc(best.pack.name)}» на ${S.size} ${S.size===5?'человек':'человека'}: ${best.lines.map(l=>esc(product(l.id).name)+' × '+l.qty).join(', ')}. По отдельности ${money(full)}, в наборе ${money(price)}: экономия ${money(full-price)}.</p><button class="btn full" data-action="swap-to-set" data-id="${best.pack.id}">Заменить на набор</button></div></div>`;}
function tomorrowLine(){if(!F.district)return '';const fs=farmsForDistrict();if(!fs.length)return `<a class="notice warn" href="#/notify" style="margin:10px 16px">${icon('pin')}<span>${esc(F.district)}: пока не возим. Сообщим, когда привезём.</span></a>`;
  const f=fs.find(x=>x.seller.id===F.farm)||fs[0];const d=f.dates[0];
  return `<div class="notice" style="margin:10px 16px;background:var(--green-pale)">${icon('truck')}<span>${esc(F.district)}: ${d.i===0?'<strong>завтра</strong>, '+esc(d.value):'ближайшая доставка '+esc(d.label)+', '+esc(d.value)} привезёт ${esc(f.seller.short)}. <button class="text-link" data-action="nav" data-route="district">Изменить</button></span></div>`;}
function renderDistrict(){
  const head=`${header('Куда привезти?',{cart:false,sub:'Проверим, когда фермеры доставляют в ваш район'})}<div class="pad">`;
  if(!F.district||F.pickAgain)return `${head}<p class="form-intro">Выберите район Санкт-Петербурга. Дни доставки — пример расписания учебных хозяйств.</p><div class="option-list">${DISTRICTS.map(r=>`<button class="${F.district===r?'active':''}" data-action="pick-district" data-id="${esc(r)}">${esc(r)}</button>`).join('')}</div></div>`;
  const fs=farmsForDistrict();
  if(!fs.length)return renderNotify();
  const first=fs[0],tom=first.dates[0].i===0;
  const farmBtn=f=>`<button class="menu-row" data-action="choose-farm" data-id="${f.seller.id}">${icon('leaf')}<span><strong>${esc(f.seller.name)}</strong><br><small>${esc(f.dates[0].label)}, ${esc(f.dates[0].value)}</small></span>${icon('chevron')}</button>`;
  return `${head}<div class="notice ${tom?'':'warn'}" style="${tom?'background:var(--green-pale)':''}">${icon(tom?'check':'calendar')}<div><strong>${tom?'Завтра привезём':'Завтра в '+esc(F.district)+' доставки нет'}</strong><p>${tom?esc(first.seller.name)+' привезёт завтра, '+esc(first.dates[0].value):'Ближайшая доставка: '+esc(first.seller.name)+', '+esc(first.dates[0].label)+' '+esc(first.dates[0].value)+' Подходит?'}</p></div></div>
   <button class="btn full" data-action="choose-farm" data-id="${first.seller.id}">${tom?'Выбрать набор':'Да, подходит'} ${icon('arrow')}</button>
   ${fs.length>1?(FM.showOther?`<section class="section"><h2>Другие фермы в вашем районе</h2>${fs.slice(1).map(farmBtn).join('')}</section>`:`<button class="btn secondary full" style="margin-top:10px" data-action="other-farm">Другая ферма</button>`):''}
   ${tom?'':`<button class="text-link" style="margin-top:14px" data-action="nav" data-route="notify">Не подходит: сообщить, когда будет доставка раньше</button>`}
   <button class="text-link" style="margin-top:14px" data-action="change-district">${icon('pin')}Другой район</button></div>`;}
function renderNotify(){return `${header('Пока не возим',{cart:false})}<div class="pad">${FM.notifyDone?`<div class="empty">${icon('check')}<h2>Сообщим</h2><p>Как только фермеры начнут возить в ${esc(F.district||'ваш район')}, мы позвоним или напишем.</p><a class="btn" href="#/farmers">Посмотреть фермеров</a></div>`:
  `<p class="form-intro">${esc(F.district||'В ваш район')}: фермеры сюда пока не возят. Оставьте телефон, и мы сообщим, когда привезём в ваш район.</p><form id="notify-form" novalidate><label class="field" data-field="phone"><span>Телефон</span><input name="phone" type="tel" inputmode="tel" maxlength="22" placeholder="+7 (___) ___-__-__"><span class="form-error" id="error-notify"></span></label><button class="btn full" type="submit">Сообщить, когда привезём</button></form>`}
  <button class="text-link" style="margin-top:14px" data-action="change-district">${icon('pin')}Выбрать другой район</button></div>`;}
function payFailBlock(){if(!FM.payFails)return '';const two=FM.payFails>=2;
  return `<div class="notice warn error" role="alert">${icon('warning')}<div><strong>${two?'Оплата не прошла дважды':'Банк отклонил оплату'}</strong><p>${two?'Заказ сохранён в корзине. Можно попробовать позже или выбрать другой способ.':'Попробуйте другую карту или СБП.'}</p>
   <div class="option-list" style="grid-template-columns:1fr 1fr;margin-top:8px"><button class="${FM.payMethod==='card2'?'active':''}" data-action="pay-method" data-id="card2">Другая карта</button><button class="${FM.payMethod==='sbp'?'active':''}" data-action="pay-method" data-id="sbp">СБП</button></div>
   ${two?`<button class="btn secondary full" style="margin-top:8px" data-action="nav" data-route="cart">Вернуться в корзину</button>`:''}</div></div>`;}
function registerCard(o){if(F.account)return `<div class="notice" style="background:var(--green-pale)">${icon('check')}<span>Вы зарегистрированы: повторить заказ в 1 клик можно в <a class="text-link" href="#/profile">профиле</a>.</span></div>`;

   <div class="notice">${icon('calendar')}<span>${a.weekly?`Еженедельная корзина: каждый ${esc(a.weekly.weekday)}, ${esc(a.weekly.slot)}. В тестовой версии заказ сам не создаётся. <button class="text-link" data-action="weekly-off">Отключить</button>`:'Еженедельная корзина выключена.'}</span></div>
   <button class="text-link" data-action="logout">Выйти из аккаунта</button></section>`;}
function flowOnOrder(o){const d=dateOptions()[S.date];o.delivery=d.label+', '+d.value;o.deliveryIso=d.iso;o.slot=S.slot;o.seller=cartSeller();const a=appliedSet();if(a){o.set=a.pack.name+' на '+a.size;o.setRef={...F.cartSet};}
  FM.lastAddress={...S.address};FM.payFails=0;FM.payMethod='card';F.cartSet=null;saveFlow();}

 case 'map-pin':S.selectedFarm=id;S.map?.repaint();$$('.farm-list-card').forEach(c=>c.classList.toggle('selected',c.dataset.farm===id));$(`[data-farm="${id}"]`)?.scrollIntoView({block:'nearest',behavior:'smooth'});break;
 case 'map-zoom':S.map?.zoom(delta);break;
 case 'map-fit':S.map?.fit();break;
 case 'repeat-order':{const o=S.orders.find(o=>o.id===id);if(o)addToCart(C.sanitizeCart(o.lines,D.products),{openCart:true});break;}
 case 'reset-demo':openSheet('Сбросить демонстрацию?',`<p class="form-intro">Будут удалены только локальные данные этого MVP: корзина, избранное и тестовые заказы.</p><div class="sheet-actions"><button class="btn secondary" data-action="close-sheet">Отмена</button><button class="btn" data-action="do-reset-demo">Сбросить</button></div>`);break;
 case 'do-reset-demo':F={};saveFlow();S.region='Санкт-Петербург';S.cart=[];S.favorites=[];S.orders=[];S.pending=null;S.lastOrder=null;S.filters={...filterDefault};S.builder={seller:'demo-a',items:[],packageId:null};S.address={name:'',phone:'',address:''};S.checkoutValid=false;S.size=3;S.scroll={};save();closeSheet();nav('home');toast('Тестовые данные сброшены');break;
 }
});
document.addEventListener('change',e=>{
 const el=e.target;
 if(el.id==='sort'){S.filters.sort=el.value;refreshCatalog();}
 if(el.id==='delivery-slot')S.slot=el.value;
 if(el.id==='builder-seller'){
  const next=el.value;if(!seller(next))return;
  if(S.builder.items.length&&next!==S.builder.seller){el.value=S.builder.seller;openSheet('Сменить хозяйство?',`<p class="form-intro">Текущий набор в конструкторе будет очищен. Корзина заказа не изменится.</p><div class="sheet-actions"><button class="btn secondary" data-action="close-sheet">Оставить</button><button class="btn" data-action="confirm-builder-seller" data-id="${next}">Сменить</button></div>`);}else{S.builder={seller:next,items:[],packageId:null};refreshPage();}
 }
});
document.addEventListener('input',e=>{const el=e.target;if(el.form?.id==='checkout-form'&&['name','phone','address'].includes(el.name)){S.address[el.name]=el.value;S.checkoutValid=false;}});
document.addEventListener('submit',e=>{
 const form=e.target;if(!['home-search','search-form','filter-form','checkout-form'].includes(form.id))return;e.preventDefault();
 if(form.id==='home-search'||form.id==='search-form'){S.filters={...filterDefault,query:String(new FormData(form).get('query')||'').trim().slice(0,120)};S.scroll['catalog/']=0;save();closeSheet();nav('catalog');}
 if(form.id==='filter-form'){
  const v=Object.fromEntries(new FormData(form));const min=v.min.trim(),max=v.max.trim();
  if((min!==''&&(!/^\d+$/.test(min)||Number(min)>9999999))||(max!==''&&(!/^\d+$/.test(max)||Number(max)>9999999))){$('#filter-error').textContent='Введите целые неотрицательные цены';return;}
  if(min!==''&&max!==''&&Number(min)>Number(max)){$('#filter-error').textContent='Минимальная цена не может быть больше максимальной';return;}
  S.filters={...S.filters,min,max,seller:D.sellers.some(s=>s.id===v.seller)?v.seller:'',category:D.categories.some(c=>c.id===v.category)?v.category:'all'};S.scroll['catalog/']=0;save();closeSheet();nav('catalog');
 }
 if(form.id==='checkout-form'){if(!C.validCart(S.cart,D.products)){toast('Корзина изменилась. Проверьте заказ.');nav('cart');return;}if(validCheckout(form)){S.checkoutValid=true;nav('payment');}}
});
$('#sheet').addEventListener('click',e=>{if(e.target===$('#sheet')){const b=e.target.getBoundingClientRect();if(e.clientX<b.left||e.clientX>b.right||e.clientY<b.top||e.clientY>b.bottom)closeSheet();}});
window.addEventListener('hashchange',()=>{if($('#sheet').open)closeSheet();renderRoute();});
window.addEventListener('pagehide',()=>{S.address={name:'',phone:'',address:''};S.checkoutValid=false;});
window.addEventListener('storage',e=>{if(e.key!==D.storageKey)return;try{const next=JSON.parse(e.newValue||'{}');S.cart=C.sanitizeCart(next.cart,D.products);S.favorites=Array.isArray(next.favorites)?next.favorites.filter(id=>product(id)):[];S.checkoutValid=false;refreshPage();}catch{/* Keep the last valid in-memory state. */}});
// Never submit to a backend; only run local UI logic.
if(!location.hash)history.replaceState(null,'','#/home');
save();renderRoute();
window.Grabelka=Object.freeze({version:'1.0.0',demo:true,cartTotal:()=>C.total(S.cart,D.products),cartIsValid:()=>C.validCart(S.cart,D.products)});
})();

</script>
<script src="config.js"></script>
<script>
/* Google Sheets link: sends each test order to the «Заказы» sheet and shows the status the farmer sets there. */
(function(){
  const cfg=window.GRABELKA_CONFIG||{}, url=cfg.backend==='sheets'&&cfg.sheetsUrl;
  if(!url) return;
  const QKEY='grabelka.sheets.queue';
  const LABELS={new:'Новый',accepted:'Принят фермером',delivering:'Фермер в пути',done:'Доставлен',cancelled:'Отменён'};
  const read=()=>{try{return JSON.parse(localStorage.getItem(QKEY)||'[]')}catch(e){return []}};
  const write=q=>{try{localStorage.setItem(QKEY,JSON.stringify(q))}catch(e){}};
  async function post(body){
    const r=await fetch(url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body)});
    const j=await r.json(); if(!j.ok) throw new Error(j.error||'Таблица не приняла заказ');
  }
  async function flush(){
    const q=read(); if(!q.length) return; const left=[];
    for(const b of q){ try{ await post(b) }catch(e){ left.push(b) } }
    write(left);
  }
  function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
  window.GrabelkaSheets={
    lead(x){ write(read().concat([{op:'set',coll:'leads',id:'L'+Date.now().toString(36),data:{...x,createdAt:new Date().toLocaleString('ru-RU')}}])); flush(); },
    send(o,addr,dateIdx,slot){
      const D=window.GRABELKA_DATA;
      const items=o.lines.map(l=>{const p=D.products.find(x=>x.id===l.id)||{};return {pid:l.id,name:p.name||l.id,unit:p.unit||'',price:p.price||0,qty:l.qty}});
      const first=D.products.find(x=>x.id===(o.lines[0]||{}).id)||{}, sel=D.sellers.find(x=>x.id===first.sellerId)||{};
      const d=new Date(); d.setDate(d.getDate()+1+(Number(dateIdx)||0));
      const data={num:o.id,status:'new',farmId:sel.id||'',farmName:sel.name||'',buyerName:addr.name||'',phone:addr.phone||'',address:addr.address||'',
        total:o.total,commission:Math.round(o.total*0.2),deliveryDate:iso(d),slot:slot||'',weekly:false,items,createdAt:Date.now(),source:'site'};
      write(read().concat([{op:'set',coll:'orders',id:o.id,data}])); flush();
    },
  };
  async function statuses(){
    const els=document.querySelectorAll('[data-order-status]'); if(!els.length) return;
    try{
      const r=await fetch(url+(url.includes('?')?'&':'?')+'action=all&t='+Date.now()); const j=await r.json(); if(!j.ok) return;
      const map={}; j.docs.filter(d=>d.coll==='orders').forEach(d=>map[d.id]=d.data);
      els.forEach(el=>{ const o=map[el.dataset.orderStatus]; const s=o&&o.status;
        el.textContent = o ? 'Статус: '+(LABELS[s]||s) : (read().some(b=>b.id===el.dataset.orderStatus)?'Отправляем фермеру…':'');
      });
    }catch(e){}
  }
  flush(); setInterval(()=>{flush();statuses()},20000);
  new MutationObserver(()=>{clearTimeout(statuses.t);statuses.t=setTimeout(statuses,300)}).observe(document.getElementById('content'),{childList:true});
})();
</script>
