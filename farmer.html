<!doctype html>
<html lang="ru">

<style>
:root{--bg:#fbf8f0;--paper:#fffdf8;--ink:#2e2118;--muted:#827b70;--green:#416b33;--green-pale:#eaf0e2;--gold:#f1ba47;--line:#e4ddcf;--fill:#f0ebdf;--warn:#a74322;--warn-pale:#f8e6dc;--blue:#2c6aa0;--blue-pale:#e3eef8;--serif:Georgia,'Times New Roman',serif;--sans:Arial,Helvetica,sans-serif;--bottom:66px;color-scheme:light}
*{box-sizing:border-box}body{margin:0;color:var(--ink);background:#f0ede5;font-family:var(--sans);font-size:14px;line-height:1.4;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none}a{color:inherit;text-decoration:none}button:disabled{opacity:.45;cursor:not-allowed}
img{display:block;max-width:100%}h1,h2,h3,p{margin:0}h1,h2,h3{font-family:var(--serif);font-weight:700;line-height:1.15;letter-spacing:-.02em}h1{font-size:24px}h2{font-size:19px}h3{font-size:15px}
:focus-visible{outline:2px solid var(--green);outline-offset:3px}
svg.icon{width:21px;height:21px;flex-shrink:0;stroke:currentColor;fill:none;stroke-width:1.65;stroke-linecap:round;stroke-linejoin:round}
.shell{max-width:430px;min-height:100dvh;margin:0 auto;background:var(--bg);box-shadow:0 0 80px #3428180a;padding-bottom:calc(var(--bottom) + 30px)}
.shell.nonav{padding-bottom:30px}
.top{display:flex;align-items:center;gap:10px;padding:12px 15px 6px;min-height:58px}
.top .brand{display:flex;align-items:center;gap:8px;flex:1}.brand svg{width:26px;height:38px}.brand b{font-family:var(--serif);font-size:19px;color:var(--green)}.brand small{display:block;font-size:10px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.icon-btn{width:40px;height:40px;display:grid;place-items:center;border-radius:10px}
.page-head{display:flex;align-items:center;gap:6px;padding:10px 8px 6px}.page-head h1{font-size:20px;flex:1}.page-head p{font-size:11px;color:var(--muted)}
.pad{padding:0 15px}.section{margin:22px 0}.section-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.muted{color:var(--muted)}.small{font-size:11px}.tiny{font-size:10px}
.btn{min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:9px;padding:10px 16px;font-weight:600;font-size:13px;background:linear-gradient(100deg,#efb944,#f5c247);box-shadow:inset 0 1px #ffdf8c,inset 0 0 0 1px #d9a43140;text-align:center;line-height:1.25}
.btn.green{background:var(--green);color:#fff;box-shadow:none}.btn.ghost{background:var(--paper);box-shadow:inset 0 0 0 1px var(--line)}.btn.danger{background:var(--warn-pale);color:var(--warn);box-shadow:none}
.btn.block{width:100%}.btn.sm{min-height:34px;padding:6px 12px;font-size:12px}
.row{display:flex;gap:8px;align-items:center}.row>.btn{flex:1}
.card{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px}
.card.flat{background:var(--fill);border-color:transparent}
.notice{padding:12px;background:var(--fill);border-radius:9px;font-size:12px;line-height:1.45;display:flex;gap:9px;margin:12px 0}.notice.ok{background:var(--green-pale)}.notice.warn{background:var(--warn-pale);color:#5c2412}.notice.blue{background:var(--blue-pale)}
.notice .icon{width:18px;height:18px}
.field{display:block;margin-bottom:13px}.field>span{display:block;font-size:12px;font-weight:600;margin-bottom:5px}.field>span i{font-style:normal;color:var(--warn)}
.field input,.field select,.field textarea{width:100%;min-height:44px;border:1px solid var(--line);border-radius:8px;background:var(--paper);padding:10px 11px;font-size:16px}
.field textarea{min-height:70px;resize:vertical}.field .hint{display:block;font-size:11px;color:var(--muted);margin-top:4px}.field.bad input,.field.bad select,.field.bad textarea{border-color:var(--warn)}.field .err{display:none;font-size:11px;color:var(--warn);margin-top:4px}.field.bad .err{display:block}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:7px}.chip{min-height:36px;padding:8px 12px;border-radius:10px;background:var(--fill);font-size:12px;border:1px solid transparent}.chip.on{background:var(--green);color:#fff}
.seg{display:flex;background:var(--fill);border-radius:10px;padding:3px;margin:6px 0 14px}.seg button,.seg a{flex:1;text-align:center;padding:9px 6px;border-radius:8px;font-size:12px;font-weight:600}.seg .on{background:var(--paper);box-shadow:0 1px 3px #0001}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:700;padding:3px 7px;border-radius:20px;background:var(--fill);white-space:nowrap}
.b-new{background:#fde9b8;color:#6b4a00}.b-accepted,.b-assembled{background:var(--blue-pale);color:var(--blue)}.b-delivering{background:#efe2fb;color:#5b2d8a}.b-done{background:var(--green-pale);color:var(--green)}.b-cancelled{background:var(--warn-pale);color:var(--warn)}.b-replace{background:#ffe0ef;color:#8a1f55}
.order{display:block}.order-top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}.order-top strong{font-size:14px}.order p{font-size:12px;color:var(--muted);margin-top:4px}
.tg{background:#dfe9f2;border-radius:14px;padding:12px;margin:14px 0}.tg-head{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;margin-bottom:8px}.tg-ava{width:28px;height:28px;border-radius:50%;background:#2aa3e0;color:#fff;display:grid;place-items:center;font-size:13px}
.tg-msg{background:#fff;border-radius:4px 12px 12px 12px;padding:10px 12px;font-size:12.5px;line-height:1.5;white-space:pre-line}.tg-btns{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-top:5px}.tg-btns button{background:#ffffffd9;border-radius:8px;padding:9px;font-size:12px;font-weight:600;color:#1f6fa8}
.line{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}.line:last-child{border-bottom:0}.line img{width:46px;height:46px;border-radius:8px;object-fit:cover;background:var(--fill)}.line .grow{flex:1;min-width:0}.line .grow b{display:block;font-size:13px}.line .grow span{font-size:11px;color:var(--muted)}
.sum{display:flex;justify-content:space-between;font-size:13px;padding:4px 0}.sum.total{font-weight:700;font-size:15px;border-top:1px solid var(--line);margin-top:6px;padding-top:9px}
.prod{display:flex;gap:11px;align-items:center}.prod img{width:62px;height:62px;border-radius:9px;object-fit:cover;background:var(--fill)}.prod .grow{flex:1;min-width:0}.prod b{font-size:13px;display:block}.prod span{font-size:11px;color:var(--muted);display:block}
.stepper{display:flex;align-items:center;gap:4px}.stepper button{width:30px;height:30px;border-radius:8px;background:var(--fill);font-weight:700}.stepper output{min-width:28px;text-align:center;font-weight:700;font-size:13px}
.photo-drop{display:flex;gap:12px;align-items:center;border:1.5px dashed var(--line);border-radius:10px;padding:10px;background:var(--paper);cursor:pointer}.photo-drop img,.photo-drop .ph{width:76px;height:76px;border-radius:8px;object-fit:cover;background:var(--fill);display:grid;place-items:center;color:var(--muted)}
.check{display:flex;gap:11px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}.check .dot{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex-shrink:0}.check.done .dot{background:var(--green);border-color:var(--green);color:#fff}.check .dot .icon{width:15px;height:15px}.check .grow{flex:1}.check b{font-size:13px;display:block}.check span{font-size:11px;color:var(--muted)}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:9px}.kpi{background:var(--paper);border:1px solid var(--line);border-radius:11px;padding:12px}.kpi span{font-size:11px;color:var(--muted);display:block}.kpi b{font-family:var(--serif);font-size:21px;display:block;margin-top:3px}.kpi i{font-style:normal;font-size:10px;color:var(--muted)}
.bars{display:flex;align-items:flex-end;gap:5px;height:110px;margin-top:8px}.bars div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}.bars i{display:block;width:100%;background:var(--green);border-radius:4px 4px 0 0;min-height:2px}.bars span{font-size:9px;color:var(--muted)}
.stars{color:#d99a14;letter-spacing:1px}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.day{border-radius:8px;padding:7px 2px;text-align:center;font-size:10px;background:var(--fill);color:var(--muted)}.day b{display:block;font-size:13px;color:var(--ink)}.day.on{background:var(--green-pale)}.day.on b{color:var(--green)}.day.closed{background:var(--warn-pale)}.day.closed b{color:var(--warn);text-decoration:line-through}
.district{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:13px}.district input{width:20px;height:20px;accent-color:var(--green)}
.nav[hidden]{display:none}.nav{position:fixed;z-index:30;left:50%;bottom:0;transform:translateX(-50%);width:100%;max-width:430px;background:#fbf8f0f5;backdrop-filter:blur(12px);display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--line);height:calc(var(--bottom) + env(safe-area-inset-bottom));padding:4px 6px calc(6px + env(safe-area-inset-bottom))}
.nav a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10px;color:var(--muted);position:relative}.nav a.on{color:var(--green);font-weight:700}.nav .cnt{position:absolute;top:3px;left:55%;background:var(--warn);color:#fff;font-size:9px;font-weight:700;border-radius:9px;padding:1px 5px}
.hero{margin:4px 15px 0;border-radius:14px;overflow:hidden;display:grid;grid-template-columns:1.15fr 1fr;background:var(--fill);min-height:200px}.hero div{padding:18px 4px 18px 16px;display:flex;flex-direction:column;justify-content:center;gap:8px}.hero h1{font-size:21px;color:var(--ink)}.hero p{font-size:12px;color:var(--muted)}.hero img{width:100%;height:100%;object-fit:cover;object-position:50% 8%}
.demo{display:flex;gap:8px;align-items:flex-start;margin:8px 15px;padding:9px 11px;border-radius:9px;background:#fff6dc;font-size:11px;line-height:1.4}.demo .icon{width:16px;height:16px;color:#9a6b00}
.toast{position:fixed;left:50%;bottom:calc(var(--bottom) + 18px);transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;opacity:0;pointer-events:none;transition:.25s;z-index:60;max-width:90vw}.toast.show{opacity:1;transform:translate(-50%,0)}
dialog.sheet{border:0;padding:0;margin:auto auto 0;width:100%;max-width:430px;border-radius:16px 16px 0 0;background:var(--bg);max-height:88dvh}dialog.sheet::backdrop{background:#2e211866}.sheet-head{display:flex;align-items:center;padding:12px 15px;border-bottom:1px solid var(--line)}.sheet-head h2{flex:1;font-size:17px}.sheet-body{padding:15px;overflow:auto;max-height:calc(88dvh - 60px)}
.act{background:#fff;border:1px solid var(--line);padding:18px;font-family:var(--serif);font-size:13px}.act h2{text-align:center;font-size:16px;margin-bottom:4px}.act table{width:100%;border-collapse:collapse;margin:12px 0;font-family:var(--sans);font-size:11.5px}.act td,.act th{border:1px solid #cfc6b5;padding:5px;text-align:left}.act td.r,.act th.r{text-align:right}
.empty{text-align:center;padding:30px 20px;color:var(--muted)}.empty .icon{width:36px;height:36px;margin:0 auto 8px}
.link{color:var(--green);font-weight:600;font-size:12px;display:inline-flex;align-items:center;gap:4px}
@media print{.nav,.top,.page-head,.demo,.no-print{display:none!important}.shell{box-shadow:none;padding:0}body{background:#fff}}
</style>
</head>
<body>

<script src="config.js"></script>
<script>
(function(){

/* ===== Icons (same set as the storefront) ===== */
const P={home:'M3 10.5 12 3l9 7.5M5.5 9v12h5v-7h3v7h5V9',basket:'M3 8h18l-2 13H5L3 8ZM7 8l5-6 5 6M8 12v5M12 12v5M16 12v5',user:'M16.5 7a4.5 4.5 0 1 1-9 0 4.5 4.5 0 0 1 9 0M3 22v-2a7 7 0 0 1 7-7h4a7 7 0 0 1 7 7v2H3Z',grid:'M3 3h7v7H3ZM14 3h7v7h-7ZM3 14h7v7H3ZM14 14h7v7h-7Z',list:'M8 5h13M8 12h13M8 19h13M3 5h.01M3 12h.01M3 19h.01',back:'M20 12H4M10 6l-6 6 6 6',chevron:'m9 5 7 7-7 7',arrow:'M4 12h16M14 6l6 6-6 6',plus:'M12 5v14M5 12h14',x:'m6 6 12 12M6 18 18 6',check:'m5 12 4 4 10-10',shield:'M12 2 3 6v6c0 5 9 10 9 10s9-5 9-10V6L12 2Zm-5 10 3 3 6-6',info:'M12 8h.01M12 11v6M22 12a10 10 0 1 1-20 0 10 10 0 0 1 20 0',warning:'m12 3 10 18H2L12 3ZM12 9v5M12 17h.01',trash:'M3 6h18M9 6V3h6v3M5 6l1 15h12l1-15M10 10v7M14 10v7',truck:'M1 4h13v13H1ZM14 9h4l4 5v3h-8M5 21a3 3 0 1 1 0-6 3 3 0 0 1 0 6M18 21a3 3 0 1 1 0-6 3 3 0 0 1 0 6',clock:'M12 7v5l3 2M22 12a10 10 0 1 1-20 0 10 10 0 0 1 20 0',calendar:'M3 5h18v16H3ZM7 2v6M17 2v6M3 10h18M7 14h2M13 14h2M7 18h2',leaf:'M3 21c2-9 7-13 16-17M4 16C1 5 9 1 22 2c-1 13-7 21-18 14Z',package:'m3 7 9-5 9 5v11l-9 5-9-5V7ZM3 7l9 5 9-5M12 12v11M7 4l10 6',credit:'M2 5h20v15H2ZM2 10h20M6 15h4',lock:'M5 10h14v12H5ZM8 10V6a4 4 0 0 1 8 0v4M12 15v3',document:'M4 2h11l5 5v15H4ZM14 2v6h6M8 12h8M8 16h8',refresh:'M21 4v6h-6M3 20v-6h6M4 8a8 8 0 0 1 13-4l4 6M3 14l4 6a8 8 0 0 0 13-4',chart:'M3 3v18h18M7 15v3M11 10v8M15 12v6M19 6v12',send:'M22 2 11 13M22 2l-7 20-4-9-9-4 20-7Z',camera:'M3 7h4l2-3h6l2 3h4v13H3ZM15.5 13a3.5 3.5 0 1 1-7 0 3.5 3.5 0 0 1 7 0',swap:'M7 4 3 8l4 4M3 8h14M17 20l4-4-4-4M21 16H7',star:'m12 2 3 7 7 .6-5.3 4.7 1.6 7.2L12 17.8 5.7 21.5l1.6-7.2L2 9.6 9 9Z',pin:'M20 10c0 6-8 12-8 12S4 16 4 10a8 8 0 0 1 16 0ZM15 10a3 3 0 1 1-6 0 3 3 0 0 1 6 0',phone:'M5 2h4l2 5-3 2a11 11 0 0 0 7 7l2-3 5 2v4a2 2 0 0 1-2 2A18 18 0 0 1 3 4a2 2 0 0 1 2-2'};
const ic=(n,c='')=>`<svg class="icon ${c}" viewBox="0 0 24 24" aria-hidden="true"><path d="${P[n]||P.leaf}"/></svg>`;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>Math.round(n).toLocaleString('ru-RU').replace(/ /g,' ')+' ₽';
const $=s=>document.querySelector(s);
const MARKUP=0.25; // Грабелька: цена на сайте = цена фермера + 25%, это ровно 20% от цены на сайте
const sitePrice=p=>Math.round(p*(1+MARKUP));
const farmerPart=t=>Math.round(t/(1+MARKUP));
// farmer always gets his own price for every item; set discounts are paid by Grabelka
const part=o=>o.items.filter(i=>!i.removed).reduce((s,i)=>s+Math.round(i.price/(1+MARKUP))*i.qty,0);
const DAY=864e5;
const pad2=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());
const today=()=>{const d=new Date();d.setHours(12,0,0,0);return d;};
const addDays=(d,n)=>new Date(d.getTime()+n*DAY);
const WD=['вс','пн','вт','ср','чт','пт','сб'];
const WDL=['воскресенье','понедельник','вторник','среда','четверг','пятница','суббота'];
const MONTHS=['январь','февраль','март','апрель','май','июнь','июль','август','сентябрь','октябрь','ноябрь','декабрь'];
const MONTHS_G=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const human=s=>{const d=new Date(s+'T12:00:00');return d.getDate()+' '+MONTHS_G[d.getMonth()]+', '+WD[d.getDay()];};
const DISTRICTS=['Адмиралтейский','Василеостровский','Выборгский','Калининский','Кировский','Колпинский','Красногвардейский','Красносельский','Московский','Невский','Петроградский','Приморский','Фрунзенский','Центральный'];
const SLOTS=['9:00–12:00','12:00–15:00','15:00–18:00','18:00–21:00'];
const CATS={milk:'Молочное',eggs:'Яйца',meat:'Мясо',vegetables:'Овощи',cheese:'Сыры',honey:'Мёд'};
const STATUS={new:'Новый',accepted:'Принят',assembled:'Собран',delivering:'В пути',done:'Доставлен',cancelled:'Отменён',replace:'Ждём ответа о замене'};
// sheet stores human words for steps the storefront does not know yet
const SHEET_WORD={assembled:'Собран фермером',replace:'Ждём ответа о замене'};
const fromSheet=s=>{const m=Object.entries(SHEET_WORD).find(([,w])=>w===s);return m?m[0]:(STATUS[s]?s:'new');};
const DOCS=[{id:'status',name:'ИП или самозанятый',hint:'Выписка ЕГРИП или справка «Мой налог»',required:true},{id:'vet',name:'Ветеринарные документы',hint:'ВСД из «Меркурия» на молоко, мясо, яйца',required:true},{id:'decl',name:'Декларация соответствия',hint:'Если есть. Ускоряет проверку',required:false},{id:'photos',name:'Фото хозяйства',hint:'Двор, животные, место хранения',required:true}];
const TEMPLATES=[
 {id:'trial',name:'Пробный',sub:'Познакомиться с фермой',slots:[{label:'Молоко',cat:'milk',q:{3:3,4:5,5:6}},{label:'Творог или кефир',cat:'milk',q:{3:3,4:3,5:5}},{label:'Яйца',cat:'eggs',q:{3:4,4:6,5:6}}]},
 {id:'family',name:'Семейный',sub:'Базовые продукты на неделю',slots:[{label:'Молоко',cat:'milk',q:{3:3,4:4,5:6}},{label:'Творог',cat:'milk',q:{3:2,4:3,5:4}},{label:'Яйца',cat:'eggs',q:{3:3,4:4,5:5}},{label:'Овощи 1',cat:'vegetables',q:{3:3,4:3,5:3}},{label:'Овощи 2',cat:'vegetables',q:{3:2,4:3,5:2}}]},
 {id:'meat',name:'Мясной',sub:'Для обедов и ужинов',slots:[{label:'Мясо 1',cat:'meat',q:{3:1,4:1,5:2}},{label:'Мясо 2',cat:'meat',q:{3:1,4:2,5:1}},{label:'Овощи 1',cat:'vegetables',q:{3:1,4:1,5:1}},{label:'Овощи 2',cat:'vegetables',q:{3:1,4:1,5:1}}]}];

const roundSet=x=>Math.round(x*(1-SET_DISCOUNT)/10)*10;

/* ===== Demo data (fictional farms and buyers, no real personal data) ===== */
function seedProducts(fid){
 const t=today(),d=n=>iso(addDays(t,n));
 if(fid==='demo-b')return [
  {id:'milk-b',name:'Молоко коровье сырое',category:'milk',price:184,unit:'1 л',photo:'img/products/milk-b.jpg',made:d(-1),expires:d(3),stock:30,composition:'Молоко коровье цельное',storage:'+2…+6 °C',active:true},
  {id:'eggs-b',name:'Яйца куриные',category:'eggs',price:240,unit:'10 шт.',photo:'img/products/eggs-b.jpg',made:d(-2),expires:d(23),stock:40,composition:'Яйца куриные, категория С0',storage:'0…+20 °C',active:true}];

function seedOrders(fid,products){
 const t=today(),byId=Object.fromEntries(products.map(p=>[p.id,p]));
 const mk=(num,status,dayShift,buyer,lines,slot,extra={})=>{const items=lines.filter(([id])=>byId[id]).map(([id,q])=>({pid:id,name:byId[id].name,unit:byId[id].unit,price:sitePrice(byId[id].price),qty:q}));
  return {id:num,num,status,deliveryDate:iso(addDays(t,dayShift)),slot,buyerName:buyer,buyerId:buyer,address:'ул. Примерная, д. '+(3+num.length%9)+' (пример)',phone:'+7 900 000-00-00',items,total:extra.set?roundSet(items.reduce((s,i)=>s+i.price*i.qty,0)):items.reduce((s,i)=>s+i.price*i.qty,0),demo:true,createdAt:addDays(t,Math.min(dayShift,0)-1).getTime(),...extra};};
 const L=fid==='demo-b'?[['milk-b',3],['eggs-b',2]]:null;
 const live=fid==='demo-b'?[mk('ГБ-2041','new',1,'Анна',L,'12:00–15:00')]:[
  mk('ГБ-1052','new',1,'Мария К.',[['milk',3],['curd',2],['eggs',3],['carrot',3],['onion',2]],'18:00–21:00',{set:'Семейный на 3 человека'}),
  mk('ГБ-1051','new',2,'Дмитрий',[['beef',1],['pork',1],['carrot',1],['onion',1],['brisket',1]],'12:00–15:00'),
  mk('ГБ-1049','accepted',1,'Ольга',[['milk',4],['eggs',2],['curd',3]],'9:00–12:00'),
  mk('ГБ-1047','delivering',0,'Анна',[['milk',3],['curd',3],['eggs',4]],'15:00–18:00',{set:'Пробный на 3 человека'})];
 // history for stats and payouts: last ~75 days, deterministic
 const hist=[];let seed=fid==='demo-b'?7:3;const rnd=()=>{seed=(seed*9301+49297)%233280;return seed/233280;};
 const pool=products.filter(p=>p.price<1000).map(p=>p.id);
 for(let i=1;i<=75;i++){const day=addDays(t,-i);const wd=day.getDay();if(fid==='demo-b'?![1,3,5].includes(wd):![2,4,6].includes(wd))continue;
  const n=fid==='demo-b'?1:1+Math.floor(rnd()*3);
  for(let k=0;k<n;k++){const lines=[];const cnt=2+Math.floor(rnd()*3);for(let j=0;j<cnt;j++){const id=pool[Math.floor(rnd()*pool.length)];if(!lines.some(l=>l[0]===id))lines.push([id,1+Math.floor(rnd()*4)]);}
   if(rnd()<.25&&fid!=='demo-b')lines.push(['beef',1]);
   const bi=Math.floor(rnd()*rnd()*45);const o=mk('ГБ-'+(900-hist.length),rnd()<.06?'cancelled':'done',-i,BUYERS[bi%BUYERS.length],lines,SLOTS[Math.floor(rnd()*4)],{buyerId:'b'+bi});hist.push(o);}}
 return live.concat(hist);
}

function checkProduct(form){const v=Object.fromEntries(new FormData(form).entries());const err={};

 form.querySelectorAll('[data-f]').forEach(el=>{const e=err[el.dataset.f];el.classList.toggle('bad',!!e);el.querySelector('.err').textContent=e||'';});

function readPhoto(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{const k=Math.min(1,640/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.8));};img.onerror=rej;img.src=r.result;};r.onerror=rej;r.readAsDataURL(file);});}

 const inRange=(o,a,b)=>{const d=new Date(o.deliveryDate+'T12:00:00');return d>addDays(t,-a)&&d<=addDays(t,-b);};
 const w=done.filter(o=>inRange(o,7,0)),wPrev=done.filter(o=>inRange(o,14,7)),m=done.filter(o=>inRange(o,30,0));
 const sum=a=>a.reduce((s,o)=>s+part(o),0);
 const diff=(a,b)=>b?Math.round((a-b)/b*100):0;
 // repeat share: orders (30 days) from buyers who had an earlier order
 const sorted=done.slice().sort((a,b)=>a.deliveryDate.localeCompare(b.deliveryDate));const seen=new Set();let rep=0,cnt=0;const from=iso(addDays(t,-30));
 sorted.forEach(o=>{const isRep=seen.has(o.buyerId);if(o.deliveryDate>from){cnt++;if(isRep)rep++;}seen.add(o.buyerId);});
 const top={};m.forEach(o=>o.items.filter(i=>!i.removed).forEach(i=>{top[i.name]=(top[i.name]||0)+Math.round(i.price/(1+MARKUP))*i.qty;}));const topL=Object.entries(top).sort((a,b)=>b[1]-a[1]).slice(0,5);const topMax=topL[0]?.[1]||1;
 const weeks=Array.from({length:8},(_,i)=>{const a=(8-i)*7,b=(7-i)*7;return {label:addDays(t,-b).getDate()+'.'+pad2(addDays(t,-b).getMonth()+1),v:sum(done.filter(o=>inRange(o,a,b)))};});const wMax=Math.max(...weeks.map(x=>x.v),1);
 const cancelled=os.filter(o=>o.status==='cancelled'&&inRange(o,30,0)).length;
 const rating=f.reviews.length?(f.reviews.reduce((s,r)=>s+r.stars,0)/f.reviews.length):0;
 return `<div class="kpis"><div class="kpi"><span>Выручка за 7 дней</span><b>${money(sum(w))}</b><i>${diff(sum(w),sum(wPrev))>=0?'+':''}${diff(sum(w),sum(wPrev))}% к прошлой неделе</i></div><div class="kpi"><span>Выручка за 30 дней</span><b>${money(sum(m))}</b><i>ваша часть, без доли Грабельки</i></div>
 <div class="kpi"><span>Заказов за 30 дней</span><b>${m.length}</b><i>средний ${money(m.length?sum(m)/m.length:0)}${cancelled?` · отказов ${cancelled}`:''}</i></div><div class="kpi"><span>Повторные заказы</span><b>${cnt?Math.round(rep/cnt*100):0}%</b><i>${rep} из ${cnt} за 30 дней</i></div>
 <div class="kpi"><span>Рейтинг</span><b>${rating?rating.toFixed(1).replace('.',','):'—'} <span class="stars" style="font-size:14px">★</span></b><i>${f.reviews.length} отзывов</i></div><div class="kpi"><span>Товаров в продаже</span><b>${activeProducts(f).length}</b><i>из ${f.products.length}</i></div></div>
 <section class="section"><h2>Выручка по неделям</h2><div class="bars" role="img" aria-label="Выручка по неделям">${weeks.map(x=>`<div title="${money(x.v)}"><i style="height:${Math.round(x.v/wMax*88)}%"></i><span>${x.label}</span></div>`).join('')}</div></section>
 <section class="section"><h2 style="margin-bottom:8px">Топ товаров за 30 дней</h2>${topL.length?topL.map(([n,v])=>`<div style="margin-bottom:9px"><div class="sum" style="padding:0 0 3px"><span>${esc(n)}</span><b>${money(v)}</b></div><div style="height:7px;background:var(--fill);border-radius:4px"><div style="height:100%;width:${Math.round(v/topMax*100)}%;background:var(--gold);border-radius:4px"></div></div></div>`).join(''):'<p class="small muted">Пока нет доставленных заказов.</p>'}</section>`;}
function monthActs(os){const by={};os.filter(o=>o.status==='done').forEach(o=>{const k=monthKey(o.deliveryDate);(by[k]=by[k]||[]).push(o);});return Object.entries(by).sort((a,b)=>b[0].localeCompare(a[0]));}
function payouts(f,os){const cur=monthKey(iso(today()));const acts=monthActs(os);const curOrders=(acts.find(a=>a[0]===cur)||[0,[]])[1];

 <h2 style="margin:16px 0 8px">Акты</h2>${acts.map(([k,a])=>{const [y,mo]=k.split('-').map(Number);const paid=k<cur;return `<a class="card order" href="#/act/${k}"><div class="order-top"><strong>${MONTHS[mo-1][0].toUpperCase()+MONTHS[mo-1].slice(1)} ${y}</strong><span class="badge ${paid?'b-done':'b-new'}">${paid?'Выплачено':'Месяц идёт'}</span></div><p>${a.length} заказов · продано на ${money(tot(a))} · к выплате <b>${money(a.reduce((s,o)=>s+part(o),0))}</b></p></a>`;}).join('')||'<p class="small muted">Актов пока нет.</p>'}`;}

 <p class="small" style="margin-top:10px">Исполнитель: сервис «Грабелька» (учебный проект).<br>Продавец: ${esc(f.name)}, ${esc(f.person)}.</p>
 <table><thead><tr><th>Дата</th><th>Заказ</th><th class="r">Оплачено покупателем</th><th class="r">Продавцу</th></tr></thead><tbody>${a.sort((x,z)=>x.deliveryDate.localeCompare(z.deliveryDate)).map(o=>`<tr><td>${o.deliveryDate.slice(8)}.${pad2(mo)}</td><td>${esc(o.num)}</td><td class="r">${money(o.total)}</td><td class="r">${money(part(o))}</td></tr>`).join('')}</tbody>

 <p class="small">Вознаграждение агрегатора (наценка 25% к цене продавца, скидки на наборы за счёт агрегатора): <b>${money(tot-pay)}</b>.<br>К перечислению продавцу: <b>${money(pay)}</b>.</p><p class="small" style="margin-top:14px">Стороны претензий не имеют.</p></div>
